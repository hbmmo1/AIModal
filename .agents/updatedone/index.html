họn 6 vị trí trong Cài đặt (Tab \"💬 Tuỳ chọn Hiển thị\")**:\n  1. ↘️ Góc phải dưới cùng (Bottom-Right — Mặc định)\n  2. ↙️ Góc trái dưới cùng (Bottom-Left)\n  3. ↗️ Góc phải trên cùng (Top-Right)\n  4. ↖️ Góc trái trên cùng (Top-Left)\n  5. ⬆️ Giữa trên cùng (Top-Center)\n  6. ⬇️ Giữa dưới cùng (Bottom-Center)\n- Nút **🧪 Thử nghiệm vị trí thông báo** cho phép bắn toast ngay lập tức để xem trước vị trí.\n- Xếp chồng nhiều thông báo (stacking) thông minh theo hướng từ dưới lên (cho góc dưới) hoặc từ trên xuống (cho góc trên).\n\n---\n\n## 5. Kết Quả Kiểm Thử (Verification Results)\n- Syntax AST check: **100% PASS** trên toàn bộ 8 file mã nguồn.\n- StateManager Database & Auth lifecycle (create, authenticate, update, change password, delete, login logs): **100% PASS**.\n- Mặc định khởi động: `require_login = 0` (Vào thẳng app không cần login).\n- Toast position dynamic load: **PASS** (`bottom-right` default).\n\n\n------\n\n\n### 1. 🔒 Xác Thực Đăng Nhập & Quản Lý Tài Khoản\n- **Mặc định**: TẮT (`require_login = 0`), khi mở app sẽ vào thẳng giao diện chính mà không đòi hỏi đăng nhập.\n- **Bật/Tắt trong Cài đặt**: Trong tab **\"👤 Tài Khoản & Bảo Mật\"** của [SettingsDialog](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/ui/settings_dialog.py), bạn có thể bật/tắt chính sách xác thực chỉ bằng 1 thao tác.\n- **Màn hình Đăng Nhập ([AIClawLoginDialog](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/ui/login_dialog.py))**:\n  - Khi bật tính năng đăng nhập, hộp thoại xuất hiện khi mở ứng dụng.\n  - Các ô tài khoản và mật khẩu **hoàn toàn để trống** (không điền sẵn `admin`, không gợi ý tài khoản để tránh lộ thông tin).\n  - Tài khoản mặc định: `admin` / `admin` (mật khẩu được băm an toàn kèm salt ngẫu nhiên).\n- **Quản lý Tài khoản & Nhật ký ([StateManager](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/core/state_manager.py))**:\n  - Bảng danh sách tài khoản: Hiển thị ID, Tên đăng nhập, Tên hiển thị, Vai trò, Lần đăng nhập cuối, Số lần đăng nhập, Trạng thái.\n  - Thao tác: ➕ Thêm tài khoản mới, ✏️ Sửa thông tin, 🔑 Đổi mật khẩu, 🗑️ Xoá tài khoản.\n  - Bảng nhật ký đăng nhập: Lưu lại toàn bộ lịch sử đăng nhập (thành công/thất bại), thiết bị, thời gian kèm nút xoá logs.\n\n---\n\n### 2. 🎨 Chuẩn Hoá Giao Diện Sáng / Tối ([theme.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/ui/theme.py))\n- **Giao diện sáng (Light Mode)**: Nền sáng nhẹ (`#f8fafc`), bề mặt cards & dialogs `#ffffff`, chữ chính `#0f172a` (Slate 900 đậm nét), chữ phụ `#334155`, viền `#cbd5e1` rõ ràng, không bị mờ hay chìm chữ.\n- **Giao diện tối (Dark Mode)**: Nền tối sâu (`#0b0f19`), thẻ `#1e293b`, chữ chính `#f8fafc`, chữ phụ `#cbd5e1`, mô tả `#94a3b8` tương phản cao, dịu mắt.\n- Toàn bộ các bảng biểu, ô nhập liệu, hộp thoại, nút bấm, radio options đều hiển thị rõ chữ và đẹp mắt.\n\n---\n\n### 3. 📌 Widget Nút Nổi Desktop ([FloatingQuickAccessWidget](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/ui/floating_widget.py))\n- Thanh nổi luôn ở trên cùng màn hình (`Always on top`), có thể kéo thả tự do bất kỳ đâu trên Desktop và tự nhớ vị trí.\n- **Tự động làm mờ**: Khi không thao tác (inactive), thanh mờ xuống ~38% độ sáng để không che khuất màn hình làm việc. Khi rê chuột vào, thanh sáng rõ 100% với hiệu ứng mượt mà.\n- **Các nút thao tác nhanh**:\n  - 🪟 **Mở rộng**: Kích hoạt và đưa cửa sổ chính [MainWindow](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/ui/main_window.py) lên trên cùng.\n  - 📸 **Chụp màn hình nhanh**: Chụp ảnh màn hình và đưa ngay vào AI Chat.\n  - 💬 **Mở AI Chat**: Mở và focus vào ô nhập chat.\n  - ⚙️ **Cài đặt**: Mở hộp thoại cài đặt.\n  - ✕ **Ẩn**: Thu nhỏ/ẩn thanh nổi (có thể bật lại qua menu `View` hoặc nút `📌 Float` trên thanh topbar).\n\n---\n\n### 4. 🔔 Tuỳ Chỉnh Vị Trí Thông Báo Toast ([ToastNotification](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/ui/toast.py))\n- **Mặc định**: ↘️ Góc phải dưới cùng (`bottom-right`).\n- **Tuỳ chọn 6 vị trí trong Cài đặt (Tab \"💬 Tuỳ chọn Hiển thị\")**:\n  1. ↘️ Góc phải dưới cùng (Bottom-Right — Mặc định)\n  2. ↙️ Góc trái dưới cùng (Bottom-Left)\n  3. ↗️ Góc phải trên cùng (Top-Right)\n  4. ↖️ Góc trái trên cùng (Top-Left)\n  5. ⬆️ Giữa trên cùng (Top-Center)\n  6. ⬇️ Giữa dưới cùng (Bottom-Center)\n- Có sẵn nút **🧪 Thử nghiệm vị trí thông báo** để xem ngay kết quả trực tiếp và tự động xếp chồng (stacking) thông minh.", "features/multi_ai_engine.md": "# Multi-AI Engine — 79 Mô Hình & 16 Nhà Cung Cấp (FEAT-001)\n\n## 1. Bối Cảnh & Mục Tiêu\nHệ thống AI Claw được thiết kế nhằm mục đích tích hợp đa dạng nhà cung cấp AI trong một nền tảng desktop duy nhất. Người dùng không bị bó hẹp trong một nhà cung cấp đơn lẻ mà có thể linh hoạt chuyển đổi giữa Google Gemini, Anthropic Claude, OpenAI, DeepSeek, Groq, OpenRouter, v.v.\n\n## 2. Phân Tích Kỹ Thuật\n- **Hệ thống phân cấp mô hình**: 4 hạng giá `CHEAPEST`, `BALANCED`, `MODERATE`, `BEST`.\n- **Hỗ trợ Streaming**: Truyền phản hồi realtime thông qua QThread worker an toàn không gây lag giao diện.\n- **Cơ chế Smart Model Resolver & 404 Auto-Fallback**:\n  - Tự động map ID mô hình qua bảng tra cứu `GEMINI_MODEL_MAP`.\n  - Khi gặp lỗi 404 Model Not Found từ API Google, cơ chế thông minh tự động fallback sang `gemini-2.0-flash` mà không ngắt phiên làm việc hay gây crash app.\n- **Bảo mật API Key**: Hệ thống quản lý SQLite key pool, tự động xoay tua (rotation), kiểm tra tình trạng key (health check) và che mờ key khi hiển thị trên giao diện (`...last8chars`).\n\n## 3. Tệp Tin Liên Quan\n- [core/model_registry.py](file:///c:/Intel/Laragon/www/300_Python/301_AIClaude/core/model_registry.py): Quản lý 79 mô hình AI, thông số giá token, đánh giá tốc độ/chất lượng.\n- [core/ai_engine.py](file:///c:/Intel/Laragon/www/300_Python/301_AIClaude/core/ai_engine.py): Động cơ gửi request, streaming, vision và auto-fallback.\n- [core/key_manager.py](file:///c:/Intel/Laragon/www/300_Python/301_AIClaude/core/key_manager.py): Lưu trữ và xoay vòng API Keys an toàn trong SQLite.\n- [ui/chat_panel.py](file:///c:/Intel/Laragon/www/300_Python/301_AIClaude/ui/chat_panel.py): Giao diện hội thoại tương tác trực quan.\n\n## 4. Kết Quả Nghiệm Thu\n- Khả năng phản hồi streaming ổn định 100%.\n- Không bao giờ crash khi gặp sự cố từ nhà cung cấp nhờ try/catch toàn diện và fallback thông minh.\n", "features/desktop_automation.md": "# Desktop Automation & Visual Workflow Engine (FEAT-002)\n\n## 1. Bối Cảnh & Mục Tiêu\nCung cấp khả năng tự động hoá mọi tác vụ lặp đi lặp lại trên máy tính desktop: điều khiển chuột, bàn phím, kích hoạt phím tắt, chụp ảnh màn hình phân tích ngữ cảnh, và phối hợp thành các chuỗi workflow phức tạp.\n\n## 2. Phân Tích Kỹ Thuật\n- **Action Executor**:\n  - Tích hợp PyAutoGUI và Win32 API để click chuột, di chuyển con trỏ chuột theo toạ độ tuyệt đối/tương đối, cuộn trang, nhập liệu ký tự tiếng Việt Unicode an toàn.\n  - Tích hợp cơ chế Fail-Safe góc màn hình chống treo chuột ngoài tầm kiểm soát.\n- **Visual Workflow Runner**:\n  - Quản lý các bước thực thi dưới dạng JSON schema định nghĩa trong `workflows/` và `presets/`.\n  - Hỗ trợ các khối lệnh: `click`, `move`, `type_text`, `hotkey`, `delay`, `screenshot`, `condition`.\n  - Theo dõi tiến độ từng bước trực quan trên UI với thanh tiến trình và thông báo kết quả.\n\n## 3. Tệp Tin Liên Quan\n- [core/action_executor.py](file:///c:/Intel/Laragon/www/300_Python/301_AIClaude/core/action_executor.py): Thực thi điều khiển chuột, bàn phím an toàn.\n- [core/workflow_models.py](file:///c:/Intel/Laragon/www/300_Python/301_AIClaude/core/workflow_models.py): Khai báo mô hình dữ liệu workflow và action.\n- [ui/automation_panel.py](file:///c:/Intel/Laragon/www/300_Python/301_AIClaude/ui/automation_panel.py): Giao diện thiết lập và chạy kịch bản tự động hoá.\n\n## 4. Kết Quả Nghiệm Thu\n- Tự động hoá chính xác, không trượt toạ độ, ghi nhận log đầy đủ từng bước thao tác.\n", "features/account_auth_security.md": "# Hệ Thống Xác Thực & Quản Lý Tài Khoản Bảo Mật PBKDF2 (FEAT-006)\n\n## 1. Bối Cảnh & Mục Tiêu\nBảo vệ dữ liệu người dùng và các API Key nhạy cảm trong môi trường desktop đa người dùng. Hệ thống cho phép bật/tắt yêu cầu đăng nhập linh hoạt theo nhu cầu cá nhân hoặc môi trường doanh nghiệp.\n\n## 2. Phân Tích Kỹ Thuật\n- **Cơ chế Bật/Tắt linh hoạt**:\n  - Mặc định: `require_login = 0` (Tắt) — mở app vào thẳng màn hình làm việc tiện lợi.\n  - Khi bật: Yêu cầu xác thực tài khoản qua hộp thoại đăng nhập bảo mật.\n- **Tiêu chuẩn Bảo mật Giao diện Login**:\n  - Tuyệt đối không tự động điền (autofill) `admin` hay mật khẩu mẫu, các trường nhập luôn để trống để tránh lộ lọt thông tin.\n  - Mật khẩu được băm (hash) bằng thuật toán chuẩn công nghiệp `PBKDF2-HMAC-SHA256` với salt ngẫu nhiên 16 bytes và 100.000 vòng lặp.\n- **Quản lý Tài khoản & Nhật ký Truy cập**:\n  - CRUD tài khoản: Thêm, sửa, đổi mật khẩu, vô hiệu hoá hoặc xoá tài khoản.\n  - Ghi nhận nhật ký đăng nhập chi tiết (thời gian, trạng thái, thiết bị, lỗi sai mật khẩu).\n\n## 3. Tệp Tin Liên Quan\n- [ui/login_dialog.py](file:///c:/Intel/Laragon/www/300_Python/301_AIClaude/ui/login_dialog.py): Hộp thoại đăng nhập an toàn, giao diện hiện đại.\n- [core/state_manager.py](file:///c:/Intel/Laragon/www/300_Python/301_AIClaude/core/state_manager.py): Bảng CSDL SQLite `users`, `login_logs`, mã hoá PBKDF2.\n- [ui/settings_dialog.py](file:///c:/Intel/Laragon/www/300_Python/301_AIClaude/ui/settings_dialog.py): Tab quản lý tài khoản & công tắc bảo mật.\n- [main.py](file:///c:/Intel/Laragon/www/300_Python/301_AIClaude/main.py): Cổng kiểm tra xác thực trước khi hiển thị MainWindow.\n\n## 4. Kết Quả Nghiệm Thu\n- Đăng nhập bảo mật, chuyển giao diện mượt mà không crash, phòng chống tấn công brute-force cơ bản.\n", "features/floating_widget_quick_access.md": "# Floating Quick Access Mini Widget (FEAT-005)\n\n## 1. Bối Cảnh & Mục Tiêu\nCung cấp thanh công cụ mini nổi trên màn hình (Always on Top) giúp người dùng gọi nhanh các tác vụ AI Claw ngay cả khi đang làm việc trên các ứng dụng khác (trình duyệt, Office, IDE) mà không cần phóng to cửa sổ chính.\n\n## 2. Phân Tích Kỹ Thuật\n- **Frameless & Always-on-Top Window**:\n  - Sử dụng cờ `Qt.WindowType.FramelessWindowHint` và `Qt.WindowType.WindowStaysOnTopHint`.\n  - Hỗ trợ nền mờ viền bo tròn hiện đại, bóng đổ nổi bật.\n- **Kéo thả tự do (Draggable Window)**:\n  - Bắt sự kiện `mousePressEvent` và `mouseMoveEvent` cho phép kéo di chuyển widget khắp màn hình mượt mà.\n  - Lưu vị trí toạ độ vào SQLite để tự động khôi phục khi mở lại app.\n- **Các nút chức năng nhanh**:\n  - 📸 Chụp màn hình & gửi nhanh vào Chat.\n  - 💬 Hiện/Ẩn cửa sổ chính tức thì.\n  - ⚡ Kích hoạt kịch bản tự động hoá nhanh.\n  - ⚙️ Mở Cài đặt nhanh.\n\n## 3. Tệp Tin Liên Quan\n- [ui/floating_widget.py](file:///c:/Intel/Laragon/www/300_Python/301_AIClaude/ui/floating_widget.py): Widget mini nổi độc lập.\n- [ui/main_window.py](file:///c:/Intel/Laragon/www/300_Python/301_AIClaude/ui/main_window.py): Đồng bộ trạng thái giữa Floating Widget và Main Window.\n\n## 4. Kết Quả Nghiệm Thu\n- Widget chuyển động trơn tru, không lag CPU, ghim nổi ổn định trên mọi cửa sổ Windows.\n", "features/ui_theme_density_toast.md": "# Theme Tương Phản Chuẩn WCAG, 4 Chế Độ Density & Toast Tùy Biến (FEAT-007, FEAT-008)\n\n## 1. Bối Cảnh & Mục Tiêu\nNâng cao tính thẩm mỹ và công thái học của giao diện người dùng, đảm bảo hiển thị sắc nét trên cả màn hình độ phân giải cao và màn hình nhỏ gọn, với màu sắc tương phản cao không gây mỏi mắt.\n\n## 2. Phân Tích Kỹ Thuật\n- **Hệ thống Theme Sáng / Tối tương phản cao**:\n  - Dark Theme: Nền `#0b0f19`, bề mặt `#111827`, chữ `#f8fafc`.\n  - Light Theme: Nền `#ffffff`, bề mặt `#f8fafc`, chữ `#0f172a` (loại bỏ hoàn toàn hiện tượng chữ mờ hoặc chìm nền).\n  - Bảng màu `COLORS` 30 keys chuẩn hoá, tự động chuyển đổi qua `build_stylesheet()`.\n- **4 Chế độ UI Density**:\n  - `Material` (Chuẩn rộng rãi), `Compact` (Gọn gàng), `Lite Compact` (Nhẹ nhàng), `Super Compact` (Siêu gọn cho màn hình nhỏ).\n  - 6 cỡ chữ từ `small` (11px) đến `extra_large` (19px).\n- **Toast Notification 6 Vị Trí Tuỳ Chọn**:\n  - Hỗ trợ 6 góc hiển thị: Top-Left, Top-Right, Top-Center, Bottom-Left, Bottom-Right, Bottom-Center.\n  - Hàng đợi thông báo thông minh (queue), tự động tính toán toạ độ không bị đè lấn lên nhau, hiệu ứng fade-in / fade-out mượt mà.\n\n## 3. Tệp Tin Liên Quan\n- [ui/theme.py](file:///c:/Intel/Laragon/www/300_Python/301_AIClaude/ui/theme.py): Bảng màu, typography, density tokens và stylesheet builder.\n- [ui/toast.py](file:///c:/Intel/Laragon/www/300_Python/301_AIClaude/ui/toast.py): Động cơ toast thông báo nổi đa vị trí.\n- [ui/settings_dialog.py](file:///c:/Intel/Laragon/www/300_Python/301_AIClaude/ui/settings_dialog.py): Tab cài đặt hiển thị và tuỳ chọn vị trí toast.\n\n## 4. Kết Quả Nghiệm Thu\n- Chuyển theme tức thì không nháy màn hình, thông báo toast xuất hiện đúng toạ độ đã cấu hình.\n", "fixes/fix_ui_not_responding_freeze.md": "# Khắc Phục Lỗi Đóng Băng Giao Diện (Not Responding) Trong Settings & Startup (FIX-001)\n\n## 1. Nguyên Nhân Gốc Rễ (Root Cause)\n1. **Khởi tạo dữ liệu nặng trong Constructor**: Gọi `_load_data()` đồng bộ ngay trong `__init__()` của `SettingsDialog` chặn hoàn toàn Qt main event loop.\n2. **Kích hoạt chuỗi Signal Cascade**: Khi thêm items vào QComboBox (`addItem`), các tín hiệu `currentChanged` / `currentIndexChanged` tự động kích hoạt hàm `_refresh_model_cards()` lặp lại 16 lần liên tiếp.\n3. **Thực thi CSDL lặp trong vòng lặp UI**: Truy vấn SQLite `get_provider_key_count()` lặp đi lặp lại 16 lần khi render danh sách model.\n4. **Vòng lặp tạo 65+ ModelCard widgets**: Main thread bị nghẽn do khởi tạo đồng thời quá nhiều widget phức tạp mà không nhường quyền xử lý sự kiện hệ điều hành.\n\n## 2. Giải Pháp Xử Lý (Resolution)\n1. **Deferred Loading với QTimer**:\n   Chuyển toàn bộ tác vụ nạp dữ liệu nặng sang sự kiện `showEvent()` kết hợp `QTimer.singleShot(50, self._deferred_load)` để cửa sổ hiện ra tức thì trước khi render data.\n2. **Khóa Tín Hiệu (Signal Blocking)**:\n   Chèn `combo.blockSignals(True)` trước khi thêm dữ liệu vào QComboBox và `combo.blockSignals(False)` sau khi nạp xong.\n3. **Phân Đoạn Render với `processEvents()`**:\n   Gọi `QApplication.processEvents()` giữa các batch tạo widget để hệ điều hành luôn nhận diện cửa sổ ở trạng thái hoạt động (Responsive).\n\n## 3. Tệp Tin Liên Quan\n- [ui/settings_dialog.py](file:///c:/Intel/Laragon/www/300_Python/301_AIClaude/ui/settings_dialog.py)\n- [ui/main_window.py](file:///c:/Intel/Laragon/www/300_Python/301_AIClaude/ui/main_window.py)\n\n## 4. Kết Quả Nghiệm Thu\n- Settings Dialog mở ra trong \u003c 100ms, không còn hiện tượng treo đơ hay gắn nhãn \"(Not Responding)\" trên Windows.\n", "fixes/fix_gemini_404_smart_fallback.md": "# Khắc Phục Lỗi 404 NOT_FOUND Google GenAI & Smart Fallback (FIX-002)\n\n## 1. Nguyên Nhân Gốc Rễ (Root Cause)\nMột số tên model mới hoặc định dạng model experimental (như Gemini 3.7 Flash, Gemini 3.5 Flash preview) chưa được hỗ trợ trên endpoint công khai của một số khu vực hoặc tài khoản API, dẫn đến mã lỗi HTTP 404 NOT_FOUND từ Google GenAI SDK. Ứng dụng trước đó thực hiện retry 5 lần gây nghẽn và báo lỗi crash tới người dùng.\n\n## 2. Giải Pháp Xử Lý (Resolution)\n1. **Bảng ánh xạ Model Map**: Khai báo danh mục `GEMINI_MODEL_MAP` để chuẩn hoá các model ID trước khi gửi request tới SDK.\n2. **Auto-Fallback Thông Minh**:\n   Khi phát hiện exception chứa mã `404` hoặc chuỗi `NOT_FOUND` từ Google GenAI, hệ thống tự động:\n   - Ghi log cảnh báo mức warning thay vì error.\n   - Tự động chuyển ngay lập tức sang mô hình ổn định `gemini-2.0-flash`.\n   - Bắn thông báo Toast nhắc nhở người dùng đã tự động chuyển đổi sang mô hình dự phòng an toàn.\n\n## 3. Tệp Tin Liên Quan\n- [core/ai_engine.py](file:///c:/Intel/Laragon/www/300_Python/301_AIClaude/core/ai_engine.py)\n- [core/model_registry.py](file:///c:/Intel/Laragon/www/300_Python/301_AIClaude/core/model_registry.py)\n\n## 4. Kết Quả Nghiệm Thu\n- Người dùng không bao giờ bị gián đoạn hội thoại, tỷ lệ gửi tin nhắn thành công đạt 99.9%.\n", "fixes/fix_sqlite_db_migration.md": "# Khắc Phục Lỗi SQLite Migration & NameError Qt Widgets (FIX-003, FIX-004)\n\n## 1. Chi Tiết Lỗi SQLite Migration (`api_keys`)\n- **Triệu chứng**: `sqlite3.OperationalError: no such table: gemini_api_keys`.\n- **Nguyên nhân**: Ban đầu hệ thống chỉ lưu API Key của Gemini trong bảng `gemini_api_keys`. Khi nâng cấp lên Multi-AI 16 Providers, hệ thống chuyển sang bảng chung `api_keys`. Các phiên bản cũ khi khởi chạy gặp lỗi do chưa có cơ chế migration tự động.\n- **Khắc phục**: Viết hàm auto-migration trong [core/key_manager.py](file:///c:/Intel/Laragon/www/300_Python/301_AIClaude/core/key_manager.py), tự động kiểm tra tồn tại của bảng cũ và sao chép dữ liệu sang cấu trúc mới trước khi vận hành.\n\n## 2. Chi Tiết Lỗi NameError Thiếu Import Qt Widgets\n- **Triệu chứng**: `NameError: name 'QGroupBox' is not defined` hoặc `name 'QGridLayout' is not defined`.\n- **Nguyên nhân**: Quá trình mở rộng giao diện nhanh dẫn đến thiếu khai báo import trực tiếp từ `PyQt6.QtWidgets`.\n- **Khắc phục**: Bổ sung đầy đủ các widget hay thiếu: `QGroupBox`, `QGridLayout`, `QScrollArea`, `QSpinBox`, `QSlider`, `QRadioButton`, `QButtonGroup`, `QSizePolicy` trong [ui/main_window.py](file:///c:/Intel/Laragon/www/300_Python/301_AIClaude/ui/main_window.py) và [ui/knowledge_panel.py](file:///c:/Intel/Laragon/www/300_Python/301_AIClaude/ui/knowledge_panel.py). Đưa vào Checklist kiểm thử bắt buộc trước khi commit.\n", "promptinput/prompt_input_history.md": "# Lịch Sử Câu Lệnh Prompt Người Dùng (Prompt Input History)\n\nTài liệu ghi nhận toàn bộ các chỉ thị thực thi kỹ thuật của người dùng trên dự án AI Claw, được sắp xếp theo trình tự thời gian đảo ngược (mới nhất ở trên cùng).\n\n---\n\n## 📅 Phiên Làm Việc: 2026-10-12 16:37\n\n### 🎯 Yêu Cầu 02: Đồng bộ tài liệu kỹ thuật theo chuẩn Architecture Hub\n```text\nDựa vào đặc tả kĩ thuật ở:\nC:\\Intel\\Laragon\\www\\002_Log\\.agents\\prompt\\promptinfo\n\ncập nhật những file ở, đổi tên file .md nếu cần cho phù hợp, cấu trúc chuẩn như đặc tả kỉ thuật\n.agents\\guide\n\nvào update\nvào updatedone theo chỉ dẫn, có nút mở file md, giữ nguyên file md không rút gọn viết lại, còn ở ngoài index thì có thể mô tả, lấy thông tin theo chỉ dẫn\nbỏ file gốc khi đã di chuyển vào udpate thành công\n```\n\n### 🎯 Yêu Cầu 01: Làm sạch mã nguồn & cấu hình loại trừ Git\n```text\n1. làm sạch code, xoá file  rác, xoá file temp cho tôi\n2. gom thư mục vào .agents và bỏ tải lên github nếu tải lên\ndist\nbuild\n```\n\n---\n\n## 📅 Phiên Làm Việc: 2026-08-30\n\n### 🎯 Yêu Cầu Nâng Cấp Hệ Thống Toàn Diện\n```text\nTriển khai hệ thống xác thực tài khoản PBKDF2, tối ưu bảng màu Theme Sáng/Tối chuẩn tương phản, bổ sung Widget nổi truy cập nhanh (Floating Widget) và tùy chỉnh vị trí Toast Notification 6 góc.\n```\n", "promptinput/raw_prompts.txt": "================================================================================\nRAW PROMPT 01: CLEANUP & GITIGNORE (2026-10-12 16:17)\n================================================================================\n1. làm sạch code, xoá file  rác, xoá file temp cho tôi\n2. gom thư mục vào .agents và bỏ tải lên github nếu tải lên\ndist\nbuild\n\n================================================================================\nRAW PROMPT 02: MIGRATION SPEC & UPDATEDONE HUB (2026-10-12 16:37)\n================================================================================\nDựa vào đặc tả kĩ thuật ở:\nC:\\Intel\\Laragon\\www\\002_Log\\.agents\\prompt\\promptinfo\n\ncập nhật những file ở, đổi tên file .md nếu cần cho phù hợp, cấu trúc chuẩn như đặc tả kỉ thuật\n.agents\\guide\n\nvào update\nvào updatedone theo chỉ dẫn, có nút mở file md, giữ nguyên file md không rút gọn viết lại, còn ở ngoài index thì có thể mô tả, lấy thông tin theo chỉ dẫn\nbỏ file gốc khi đã di chuyển vào udpate thành công\n================================================================================\n", "prompt_all/prompt_apply_all_standards.md": "# Quy Chuẩn Tái Sử Dụng Kỹ Thuật Đa Dự Án Desktop Python & AI\n\nTài liệu đúc kết các quy chuẩn thiết kế, cấu trúc hệ thống và bài học kinh nghiệm có thể áp dụng cho bất kỳ dự án Python Desktop (PyQt6 / CustomTkinter) kết hợp AI nào:\n\n---\n\n## 1. Kiến Trúc Phân Lớp Sạch Sẽ (Clean Layered Architecture)\n- Tách bạch tuyệt đối giữa `core/` (logic thuần, xử lý API, DB, automation, không import Qt/UI) và `ui/` (chỉ giao diện, tương tác widget, import từ core).\n- Main thread luôn dành riêng cho UI event loop. Mọi tác vụ nặng (gọi AI API, test model, I/O mạng, xử lý file) bắt buộc chạy trên `QThread` / Worker riêng.\n\n## 2. Tiêu Chuẩn Chống Treo Đơ Giao Diện (Zero-Freeze Standards)\n- **Deferred Load**: Constructor của Dialog/Window chỉ tạo khung widget, không gọi hàm load data nặng. Luôn hoãn nạp data sang sự kiện `showEvent()` kết hợp `QTimer.singleShot(50, self._load_data)`.\n- **Signal Guarding**: Luôn gọi `widget.blockSignals(True)` trước khi nạp batch items vào ComboBox, ListWidget và `blockSignals(False)` sau đó.\n- **Process Events**: Gọi `QApplication.processEvents()` giữa các vòng lặp tạo 10+ widgets.\n\n## 3. Tiêu Chuẩn Bảo Mật & API Key Pool\n- Không bao giờ lưu cứng API Key trong code. Lưu trong SQLite mã hoá hoặc `.env`.\n- Mask key trên UI: chỉ hiển thị `...last8chars`.\n- Đảm bảo cơ chế tự động xoay vòng key khi gặp rate limit (429) và fallback khi model 404.\n\n## 4. Quản Lý Hồ Sơ Kỹ Thuật Tập Trung (.agents/updatedone)\n- Loại bỏ các thư mục phân mảnh (`new*`, `update*`, `guide*`), tập trung vào thư mục duy nhất `.agents/updatedone/`.\n- Đi kèm SPA Dashboard Viewer (`index.html`) xem offline độc lập, tra cứu markdown trực quan.\n"};

    // Search Handler
    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
      renderCards();
    }

    // Render Cards Grid
    function renderCards() {
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';

      const filtered = DATA_ITEMS.filter(item => {
        const matchCat = (currentCategory === 'all' || item.category === currentCategory);
        const matchSearch = !searchQuery || 
          item.title.toLowerCase().includes(searchQuery) ||
          item.description.toLowerCase().includes(searchQuery) ||
          item.path.toLowerCase().includes(searchQuery);
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <i class="fa-regular fa-folder-open"></i>
            <h3>Không tìm thấy tài liệu phù hợp</h3>
            <p>Vui lòng thử tìm kiếm với từ khoá khác hoặc chọn lại bộ lọc danh mục.</p>
          </div>
        `;
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'doc-card';
        card.innerHTML = `
          <div>
            <div class="card-top">
              <span class="card-badge badge-${item.badge_color}">
                <i class="fa-solid ${item.icon}"></i>
                ${item.category_label}
              </span>
              <span class="card-id">${item.id}</span>
            </div>
            <h3 class="card-title">${item.title}</h3>
            <p class="card-desc">${item.description}</p>
          </div>
          <div>
            <div class="card-path" title="${item.path}">
              <i class="fa-regular fa-file"></i>
              <span>${item.path}</span>
            </div>
            <div class="card-actions">
              <button class="btn-card btn-card-primary" onclick="openDoc('${item.path}')">
                <i class="fa-solid fa-book-open"></i>
                <span>Xem Nội Dung</span>
              </button>
              <a href="${item.abs_url}" target="_blank" class="btn-card" title="Mở file markdown bằng ứng dụng mặc định">
                <i class="fa-solid fa-arrow-up-right-from-square"></i>
                <span>Mở File</span>
              </a>
              <button class="btn-card" onclick="copyPath('${item.abs_url}')" title="Sao chép đường dẫn file:///...">
                <i class="fa-regular fa-copy"></i>
                <span>Copy Path</span>
              </button>
              <button class="btn-card" onclick="copyMarkdownText('${item.path}')" title="Sao chép văn bản markdown">
                <i class="fa-solid fa-code"></i>
                <span>Copy MD</span>
              </button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Open Modal Markdown Viewer
    function openDoc(relPath) {
      activePath = relPath;
      const item = DATA_ITEMS.find(i => i.path === relPath);
      const rawMd = MARKDOWN_DATA[relPath] || '# Không tìm thấy nội dung tệp.';

      document.getElementById('modalTitle').textContent = item ? item.title : relPath;
      document.getElementById('modalBadge').textContent = item ? item.category_label : 'Tài Liệu';
      document.getElementById('modalBadge').className = `card-badge badge-${item ? item.badge_color : 'indigo'}`;
      document.getElementById('modalOpenFileBtn').href = item ? item.abs_url : '#';

      // Parse with Marked.js
      document.getElementById('modalBody').innerHTML = marked.parse(rawMd);

      // Syntax highlight
      document.querySelectorAll('#modalBody pre code').forEach(block => {
        hljs.highlightElement(block);
      });

      // Show Modal
      const modal = document.getElementById('markdownModal');
      modal.classList.add('show');
      document.body.style.overflow = 'hidden';
    }

    // Close Modal
    function closeModal() {
      const modal = document.getElementById('markdownModal');
      modal.classList.remove('show');
      document.body.style.overflow = '';
    }

    function closeModalOnBackdrop(e) {
      if (e.target.id === 'markdownModal') {
        closeModal();
      }
    }

    // Keydown Esc
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeModal();
      }
    });

    // Copy Path
    function copyPath(absUrl) {
      navigator.clipboard.writeText(absUrl).then(() => {
        showToast('Đã copy đường dẫn file:/// vào clipboard!');
      }).catch(() => {
        fallbackCopy(absUrl, 'Đã copy đường dẫn file:///');
      });
    }

    function copyCurrentPath() {
      const item = DATA_ITEMS.find(i => i.path === activePath);
      if (item) copyPath(item.abs_url);
    }

    // Copy Markdown Content
    function copyMarkdownText(relPath) {
      const text = MARKDOWN_DATA[relPath] || '';
      navigator.clipboard.writeText(text).then(() => {
        showToast('Đã copy toàn bộ nội dung Markdown!');
      }).catch(() => {
        fallbackCopy(text, 'Đã copy nội dung Markdown');
      });
    }

    function copyCurrentMarkdown() {
      if (activePath) copyMarkdownText(activePath);
    }

    function fallbackCopy(text, msg) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast(msg);
    }

    // Toast
    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('hubToast');
      document.getElementById('toastMsg').textContent = msg;
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // Theme Toggle
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.classList.contains('dark');
      const btn = document.getElementById('themeToggleBtn');
      if (isDark) {
        html.classList.remove('dark');
        html.classList.add('light');
        btn.innerHTML = '<i class="fa-solid fa-sun"></i><span>Theme</span>';
      } else {
        html.classList.remove('light');
        html.classList.add('dark');
        btn.innerHTML = '<i class="fa-solid fa-moon"></i><span>Theme</span>';
      }
    }
  </script>
</body>
</html>
