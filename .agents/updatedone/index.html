<!DOCTYPE html>
<html lang="vi" class="dark">
<head>

  <!-- Google Fonts: Inter, Outfit, Fira Code -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Highlight.js CSS for Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">

  <!-- Core Libraries: Marked.js & Highlight.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/markdown.min.js"></script>

  <style>
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Outfit', sans-serif;
      --font-mono: 'Fira Code', monospace;

      /* Dark Theme */
      --bg-body: #0b0f19;
      --bg-surface: #111827;
      --bg-surface-elevated: #1f293d;
      --bg-card: rgba(17, 24, 39, 0.75);
      --bg-card-hover: rgba(31, 41, 61, 0.85);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-color-hover: rgba(99, 102, 241, 0.4);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;

      --accent-primary: #6366f1;
      --accent-hover: #4f46e5;
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --accent-violet: #8b5cf6;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;

      --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      --shadow-glow: 0 0 25px rgba(99, 102, 241, 0.25);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html.light {
      --bg-body: #f8fafc;
      --bg-surface: #ffffff;
      --bg-surface-elevated: #f1f5f9;
      --bg-card: rgba(255, 255, 255, 0.95);
      --bg-card-hover: #ffffff;
      --border-color: rgba(0, 0, 0, 0.08);
      --border-color-hover: rgba(99, 102, 241, 0.5);
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-subtle: #94a3b8;
      --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.06), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      --shadow-glow: 0 0 25px rgba(99, 102, 241, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      background-image: 
        radial-gradient(at 10% 10%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(139, 92, 246, 0.08) 0px, transparent 50%);
      background-attachment: fixed;
    }

    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Header */
    header {
      padding: 36px 0 24px 0;
      border-bottom: 1px solid var(--border-color);
      background: rgba(11, 15, 25, 0.6);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    html.light header {
      background: rgba(248, 250, 252, 0.8);
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-violet));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.4rem;
      box-shadow: var(--shadow-glow);
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 30%, var(--accent-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    html.light .brand-title {
      background: linear-gradient(135deg, #0f172a 30%, var(--accent-primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .badge-ver {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.35);
      color: #818cf8;
      font-size: 0.72rem;
      padding: 3px 10px;
      border-radius: var(--radius-full);
      font-weight: 600;
      font-family: var(--font-mono);
      margin-left: 8px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-action {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 9px 16px;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
      text-decoration: none;
    }

    .btn-action:hover {
      background: rgba(99, 102, 241, 0.15);
      border-color: var(--accent-primary);
      color: var(--accent-primary);
    }

    /* Stats Ribbon */
    .stats-ribbon {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin: 28px 0;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      backdrop-filter: blur(8px);
      transition: var(--transition);
    }

    .stat-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-color-hover);
    }

    .stat-icon {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
    }

    .stat-val {
      font-family: var(--font-display);
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Filter & Search Bar */
    .filter-section {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 18px 24px;
      margin-bottom: 28px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .tab-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab-pill {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: var(--radius-full);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }

    .tab-pill:hover {
      color: var(--text-main);
      border-color: var(--border-color-hover);
    }

    .tab-pill.active {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      color: white;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }

    .search-box {
      position: relative;
      min-width: 280px;
    }

    .search-box i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-subtle);
    }

    .search-input {
      width: 100%;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 9px 16px 9px 38px;
      border-radius: var(--radius-full);
      font-size: 0.88rem;
      outline: none;
      transition: var(--transition);
    }

    .search-input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    /* Card Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 20px;
      margin-bottom: 48px;
    }

    .doc-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow-card);
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .doc-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: transparent;
      transition: var(--transition);
    }

    .doc-card:hover {
      transform: translateY(-4px);
      border-color: var(--border-color-hover);
      box-shadow: var(--shadow-glow), var(--shadow-card);
    }

    .doc-card:hover::before {
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-cyan));
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .card-badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .badge-emerald { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-indigo { background: rgba(99, 102, 241, 0.15); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.3); }
    .badge-cyan { background: rgba(6, 182, 212, 0.15); color: #22d3ee; border: 1px solid rgba(6, 182, 212, 0.3); }
    .badge-violet { background: rgba(139, 92, 246, 0.15); color: #a78bfa; border: 1px solid rgba(139, 92, 246, 0.3); }
    .badge-amber { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-rose { background: rgba(244, 63, 94, 0.15); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.3); }

    .card-id {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-subtle);
    }

    .card-title {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 10px;
      line-height: 1.4;
      color: var(--text-main);
    }

    .card-desc {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 18px;
      line-height: 1.55;
    }

    .card-path {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-subtle);
      background: var(--bg-surface-elevated);
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      margin-bottom: 18px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 14px;
      border-top: 1px solid var(--border-color);
    }

    .btn-card {
      padding: 7px 12px;
      font-size: 0.8rem;
      font-weight: 500;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: var(--bg-surface-elevated);
      color: var(--text-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
      text-decoration: none;
    }

    .btn-card:hover {
      border-color: var(--accent-primary);
      color: var(--accent-primary);
      background: rgba(99, 102, 241, 0.1);
    }

    .btn-card-primary {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      color: white;
    }

    .btn-card-primary:hover {
      background: var(--accent-hover);
      color: white;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }

    /* Modal Viewer */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .modal-backdrop.show {
      display: flex;
      opacity: 1;
    }

    .modal-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 1100px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      transform: scale(0.95);
      transition: transform 0.25s ease;
      overflow: hidden;
    }

    .modal-backdrop.show .modal-box {
      transform: scale(1);
    }

    .modal-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      background: var(--bg-surface-elevated);
    }

    .modal-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
    }

    .modal-title {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .modal-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-btn {
      padding: 6px 12px;
      font-size: 0.8rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: var(--transition);
    }

    .modal-btn:hover {
      border-color: var(--accent-primary);
      color: var(--accent-primary);
    }

    .modal-btn-close {
      background: rgba(244, 63, 94, 0.15);
      color: #fb7185;
      border-color: rgba(244, 63, 94, 0.3);
    }

    .modal-btn-close:hover {
      background: var(--accent-rose);
      color: white;
    }

    .modal-body {
      padding: 32px;
      overflow-y: auto;
      line-height: 1.7;
    }

    /* Markdown Styling */
    .markdown-body {
      color: var(--text-main);
      font-size: 0.95rem;
    }

    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
      font-family: var(--font-display);
      color: var(--text-main);
      margin-top: 24px;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .markdown-body h1 { font-size: 1.8rem; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
    .markdown-body h2 { font-size: 1.4rem; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; }
    .markdown-body h3 { font-size: 1.15rem; }

    .markdown-body p { margin-bottom: 16px; }
    .markdown-body ul, .markdown-body ol { margin-bottom: 16px; padding-left: 24px; }
    .markdown-body li { margin-bottom: 6px; }

    .markdown-body pre {
      background: #0d1117;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-md);
      padding: 16px;
      overflow-x: auto;
      margin-bottom: 20px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
    }

    .markdown-body code:not(pre code) {
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }

    .markdown-body th, .markdown-body td {
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      text-align: left;
    }

    .markdown-body th {
      background: var(--bg-surface-elevated);
      font-weight: 600;
    }

    .markdown-body blockquote {
      border-left: 4px solid var(--accent-primary);
      padding-left: 16px;
      color: var(--text-muted);
      margin-bottom: 16px;
      background: rgba(99, 102, 241, 0.05);
      padding: 12px 16px;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }

    /* Toast Notification */
    .hub-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px 20px;
      border-radius: var(--radius-md);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 200;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .hub-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Empty State */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state i {
      font-size: 3rem;
      margin-bottom: 16px;
      color: var(--text-subtle);
    }
  </style>
</head>

ite & Config]\n        StateManager[StateManager - Thread-safe SQLite app_data.db]\n        ConfigStorage[YAML / JSON Presets & Workflows]\n        ErrorLogger[Global Crash Handler & error_log.txt]\n    end\n\n    MainWindow -->|Event Dispatch| ChatWorker\n    MainWindow -->|Quick Floating Trigger| FloatingWidget\n    MainWindow -->|Security Gate| LoginDialog\n    MainWindow -->|Alert Event| ToastManager\n\n    ChatPanel -->|User Prompt & Image| ChatWorker\n    ChatWorker -->|Generate Content| AIEngine\n    AIEngine -->|Model Query| ModelRegistry\n    AIEngine -->|Active Key| KeyManager\n    AIEngine -->|404 Handshake| SmartResolver\n\n    AutomationPanel -->|Execute Step| ActionExecutor\n    AutomationPanel -->|Capture Context| ScreenAnalyzer\n    KnowledgePanel -->|Query Chunks| KnowledgeBase\n\n    StateManager -->|Persist Chats, Users, Settings| Persistence_Layer\n    KeyManager -->|Load & Mask API Keys| Persistence_Layer\n```\n\n---\n\n## 2. Ma Trận Tính Năng Toàn Diện (Feature Matrix)\n\n| Mã ID | Tên Tính Năng | Phân Loại | Đường Dẫn Mã Nguồn | Layout Impacts | Trạng Thái |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| `FEAT-001` | Multi-AI Engine 79 Models / 16 Providers | Code Lõi | `core/ai_engine.py`, `core/model_registry.py` | `chat_panel`, `settings_dialog` | Hoàn thành |\n| `FEAT-002` | Desktop Automation & Visual Workflow | Tự Động Hoá | `core/action_executor.py`, `ui/automation_panel.py` | `automation_panel`, `workflow_tree` | Hoàn thành |\n| `FEAT-003` | Screen Analyzer MSS & WebP High Performance | Xử Lý Ảnh | `core/screen_analyzer.py` | `chat_panel`, `screenshot_btn` | Hoàn thành |\n| `FEAT-004` | Key Manager & SQLite API Rotation Pool | Bảo Mật | `core/key_manager.py` | `settings_dialog_tab2`, `key_table` | Hoàn thành |\n| `FEAT-005` | Floating Quick Access Mini Widget | Giao Diện | `ui/floating_widget.py` | `floating_dock`, `always_on_top` | Hoàn thành |\n| `FEAT-006` | Auth & User Management PBKDF2 Encryption | Bảo Mật | `ui/login_dialog.py`, `core/state_manager.py` | `login_modal`, `settings_user_tab`| Hoàn thành |\n| `FEAT-007` | Dual Theme Dark/Light & 4 UI Densities | Giao Diện | `ui/theme.py`, `ui/main_window.py` | `theme_engine`, `density_scale` | Hoàn thành |\n| `FEAT-008` | Customizable 6-Position Toast Notification | Giao Diện | `ui/toast.py` | `toast_overlay`, `smart_queue` | Hoàn thành |\n| `FEAT-009` | RAG Knowledge Base & Document Indexing | AI & Dữ Liệu | `core/knowledge_base.py`, `ui/knowledge_panel.py`| `knowledge_panel`, `doc_list` | Hoàn thành |\n| `FEAT-010` | AI Image Studio Generation & Variations | AI Đồ Hoạ | `core/image_generator.py`, `ui/image_panel.py` | `image_panel`, `gallery_view` | Hoàn thành |\n\n---\n\n## 3. Danh Mục Sửa Lỗi & Ổn Định (Bug Fixes & Lessons Learned)\n\n| Mã Fix | Tên Sự Cố Đã Xử Lý | Phân Loại | File Liên Quan | Trạng Thái |\n| :--- | :--- | :--- | :--- | :--- |\n| `FIX-001` | Khắc Phục Treo UI (Not Responding) Khi Mở Settings | Đa Luồng / UI | `ui/settings_dialog.py` | Đã giải quyết |\n| `FIX-002` | Khắc Phục Lỗi 404 NOT_FOUND Google GenAI Model | AI API | `core/ai_engine.py` | Đã giải quyết |\n| `FIX-003` | Sửa Lỗi SQLite Table Migration `api_keys` | CSDL | `core/key_manager.py` | Đã giải quyết |\n| `FIX-004` | Xử Lý NameError Thiếu Import Qt Widgets | Khởi Tạo UI | `ui/main_window.py`, `ui/knowledge_panel.py` | Đã giải quyết |\n| `FIX-005` | Xử Lý Lỗi Thread Safety Trong Chat Worker Stream | Đa Luồng | `core/ai_engine.py`, `ui/chat_panel.py` | Đã giải quyết |\n| `FIX-006` | Tối Ưu Bảng Màu Tương Phản Chuẩn WCAG Light Mode | Giao Diện | `ui/theme.py` | Đã giải quyết |\n| `FIX-007` | Cơ Chế ScrollArea Tự Động Co Giãn Thông Minh | Giao Diện | `ui/settings_dialog.py` | Đã giải quyết |\n| `FIX-008` | Dọn Dẹp Rác Build 317MB & Cấu Hình Gitignore Chuẩn | Hệ Thống | `.gitignore`, `build/`, `dist/` | Đã giải quyết |\n", "plans/ai_claw_platform_plan.md": "# 🤖 AI CLAW — Nền tảng Tự động hoá Thông minh bằng AI\n\n**Mục tiêu**: Xây dựng ứng dụng desktop Python (PyQt6) tích hợp Gemini AI, cho phép người dùng tự động hoá mọi quy trình lặp đi lặp lại trên desktop — từ thao tác chuột/bàn phím, xử lý file hàng loạt, đến workflow nhiều bước — tất cả được AI hỗ trợ tối ưu.\n\n> [!IMPORTANT]\n> **Pattern**: Dự án theo chuẩn cấu trúc của `200CanvaTool` & `100AISupport` (có `GEMINI.md`, `README.md`, `requirements.txt`, `.agents/rules/`, `build_exe.bat`, cấu trúc thư mục `core/`, `ui/`).\n\n---\n\n## 📋 User Review Required\n\n> [!WARNING]\n> **Phạm vi Phase 1**: Dự án rất lớn (5 module chính + AI engine + workflow visual). Đề xuất triển khai **Phase 1 MVP** trước với core foundation + 2-3 module chính, rồi mở rộng dần.\n\n> [!IMPORTANT]\n> **API Key**: Sẽ dùng cùng pattern `KeyManager` multi-key rotation từ `100AISupport` + hỗ trợ `.env` file. Gemini API key hiện có: `AIzaSyDAC3R0AwvYZGEcpWicsvU913GK_Orj79M`\n\n---\n\n## 🏗️ Kiến trúc Tổng thể\n\n```mermaid\ngraph TB\n    subgraph UI[\"🎨 UI Layer (PyQt6)\"]\n        MainHub[\"Main Hub Dashboard\"]\n        ChatPanel[\"AI Chat Panel\"]\n        WorkflowEditor[\"Workflow Visual Editor\"]\n        AutomationPanel[\"Automation Panel\"]\n        FileProcessor[\"File Processor Panel\"]\n        SettingsPanel[\"Settings & API Keys\"]\n    end\n\n    subgraph Core[\"⚙️ Core Engine\"]\n        AIEngine[\"Gemini AI Engine\"]\n        KeyMgr[\"Key Manager (Multi-Key Rotation)\"]\n        ActionExecutor[\"Action Executor (Mouse/Keyboard)\"]\n        WorkflowRunner[\"Workflow Runner\"]\n        FileEngine[\"File Processing Engine\"]\n        ScreenAnalyzer[\"Screen Analyzer (Vision AI)\"]\n        Scheduler[\"Task Scheduler\"]\n    end\n\n    subgraph Data[\"💾 Data Layer\"]\n        SQLite[\"SQLite Database\"]\n        Workflows[\"Workflow JSON Files\"]\n        Config[\"config.yaml + .env\"]\n        Logs[\"Execution Logs\"]\n    end\n\n    UI --> Core\n    Core --> Data\n    AIEngine --> KeyMgr\n    WorkflowRunner --> ActionExecutor\n    WorkflowRunner --> FileEngine\n    WorkflowRunner --> AIEngine\n    ScreenAnalyzer --> AIEngine\n```\n\n---\n\n## 📁 Cấu trúc Thư mục\n\n```\n300AIClaude/\n├── main.py                          # Entry point (chuẩn pattern)\n├── requirements.txt                 # Dependencies\n├── README.md                        # Hướng dẫn sử dụng\n├── GEMINI.md                        # Quy tắc phát triển cho AI\n├── run_ai_claw.bat                  # Batch launcher\n├── build_exe.bat                    # PyInstaller builder\n├── .env                             # API keys (gitignored)\n│\n├── .agents/\n│   └── rules/\n│       └── packaging_rules.md       # Quy tắc đóng gói\n│\n├── config/\n│   ├── config.yaml                  # Cấu hình chính\n│   ├── app_data.db                  # SQLite database\n│   └── persona.txt                  # AI persona / system prompt\n│\n├── core/\n│   ├── __init__.py\n│   ├── ai_engine.py                 # Gemini AI Engine (chat + tool calling)\n│   ├── key_manager.py               # Multi API Key Manager + Rotation\n│   ├── action_executor.py           # Mouse/Keyboard automation engine\n│   ├── screen_analyzer.py           # Screenshot + Gemini Vision analysis\n│   ├── file_processor.py            # Batch file processing with AI\n│   ├── workflow_runner.py           # Workflow execution engine\n│   ├── workflow_models.py           # Workflow/Node/Action data models\n│   ├── scheduler.py                 # Task scheduling (cron-like)\n│   └── state_manager.py            # App state + execution history (SQLite)\n│\n├── ui/\n│   ├── __init__.py\n│   ├── theme.py                     # Tailwind Dark Theme (chuẩn 200CanvaTool)\n│   ├── main_window.py               # Main Hub Window\n│   ├── chat_panel.py                # AI Chat Assistant Panel\n│   ├── workflow_editor.py           # Visual Workflow Editor (drag & drop)\n│   ├── automation_panel.py          # Desktop Automation Panel\n│   ├── file_panel.py                # File Processor Panel\n│   ├── settings_dialog.py           # Settings & API Key Management\n│   ├── node_widgets.py              # Visual node widgets for workflow\n│   └── log_viewer.py                # Execution log viewer\n│\n├── workflows/                       # Saved workflow JSON files\n│   └── examples/\n│       ├── web_scraping.json\n│       ├── file_rename_batch.json\n│       └── auto_form_fill.json\n│\n└── presets/                         # Preset configurations\n    └── default_actions.json\n```\n\n---\n\n## 🔧 Proposed Changes — Phase 1 MVP\n\n### Component 1: Foundation & Configuration\n\n#### [NEW] [main.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/main.py)\n- Entry point chuẩn pattern (UTF-8 config, error logging, crash dialog)\n- Khởi tạo QApplication + MainWindow\n- Exception handler toàn cục ghi `error_log.txt`\n\n#### [NEW] [.env](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/.env)\n- `GEMINI_API_KEY=AIzaSyDAC3R0AwvYZGEcpWicsvU913GK_Orj79M`\n\n#### [NEW] [config/config.yaml](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/config/config.yaml)\n- Cấu hình Gemini (api_key, model_name, temperature)\n- Cấu hình automation (default delays, hotkeys)\n- Cấu hình app (theme, language)\n\n#### [NEW] [requirements.txt](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/requirements.txt)\n```\nPyQt6>=6.6.0\ngoogle-genai>=1.0.0\nPillow>=10.2.0\npyautogui>=0.9.54\npyperclip>=1.8.2\npywin32>=306\npygetwindow>=0.0.9\npynput>=1.7.6\nkeyboard>=0.13.5\npyyaml>=6.0.1\npython-dotenv>=1.0.0\nrequests>=2.31.0\nmss>=9.0.0\n```\n\n#### [NEW] [GEMINI.md](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/GEMINI.md)\n- Quy tắc phát triển (không tự build exe, test trước khi commit)\n\n#### [NEW] [README.md](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/README.md)\n- Hướng dẫn cài đặt, chạy, sử dụng\n\n#### [NEW] [run_ai_claw.bat](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/run_ai_claw.bat)\n- Batch file khởi chạy nhanh\n\n---\n\n### Component 2: Core AI Engine\n\n#### [NEW] [core/ai_engine.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/core/ai_engine.py)\n- **GeminiEngine class** tích hợp `google-genai` SDK\n- Multi-turn conversation với context memory\n- **Tool calling / Function calling** — AI có thể gọi các hàm tự động hoá\n- Gemini Vision — phân tích screenshot\n- System prompt persona tùy chỉnh\n- Auto-retry 5 lần + key rotation khi quota hết\n- Hỗ trợ models: `gemini-3.6-flash`, `gemini-3.7-flash`, `gemini-pro-latest`\n\n#### [NEW] [core/key_manager.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/core/key_manager.py)\n- Pattern từ `100AISupport` — SQLite-backed multi-key management\n- Add/Remove/Check/Rotate keys\n- Quota tracking per key\n- Sync từ `config.yaml` + `.env`\n\n#### [NEW] [core/state_manager.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/core/state_manager.py)\n- SQLite database cho:\n  - Execution history (workflow runs, kết quả)\n  - Chat history (lưu hội thoại AI)\n  - Statistics (số lần chạy, thời gian tiết kiệm)\n\n---\n\n### Component 3: Automation Engine\n\n#### [NEW] [core/action_executor.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/core/action_executor.py)\n- **ActionExecutor class** — thực thi thao tác desktop:\n  - Mouse: click, double-click, drag, scroll, move\n  - Keyboard: key press, key combo, type text, paste\n  - Window: activate, resize, minimize, maximize\n  - Wait: delay, wait for image, wait for window\n- Thread-safe execution với stop/pause/resume\n- Hotkey listener (F8 start, F9 pause, F10 stop)\n\n#### [NEW] [core/screen_analyzer.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/core/screen_analyzer.py)\n- Chụp screenshot bằng `mss` (nhanh hơn pyautogui)\n- Gửi screenshot lên Gemini Vision để:\n  - Nhận diện vị trí element (nút, textbox, menu...)\n  - Mô tả nội dung màn hình\n  - Đề xuất hành động tiếp theo\n- OCR đơn giản qua Gemini Vision\n\n#### [NEW] [core/workflow_models.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/core/workflow_models.py)\n- **Node types** (dataclasses):\n  - `TriggerNode` — điểm bắt đầu (manual, schedule, hotkey)\n  - `ActionNode` — thao tác (click, type, wait, open app...)\n  - `AINode` — gọi Gemini AI (chat, vision, summarize, translate...)\n  - `FileNode` — xử lý file (rename, move, compress, convert...)\n  - `ConditionNode` — rẽ nhánh IF/ELSE\n  - `LoopNode` — vòng lặp\n  - `WebNode` — web actions (open URL, scrape, fill form)\n- **Workflow** — danh sách nodes liên kết (graph structure)\n- Serialization JSON (save/load)\n\n#### [NEW] [core/workflow_runner.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/core/workflow_runner.py)\n- Thực thi workflow step-by-step\n- Hỗ trợ conditional branching & loops\n- Real-time progress callbacks\n- Error handling + retry logic\n- Execution log\n\n#### [NEW] [core/file_processor.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/core/file_processor.py)\n- Batch file operations:\n  - AI rename (Gemini phân tích nội dung → gợi ý tên)\n  - AI classify (phân loại file vào thư mục)\n  - AI summarize (tóm tắt nội dung document)\n  - Bulk convert (format chuyển đổi)\n- Progress tracking\n\n#### [NEW] [core/scheduler.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/core/scheduler.py)\n- Schedule workflow runs (one-time, recurring)\n- Cron-like scheduling\n- Background execution\n\n---\n\n### Component 4: UI Layer (PyQt6 — Tailwind Dark Theme)\n\n#### [NEW] [ui/theme.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/ui/theme.py)\n- Tailwind Dark theme chuẩn `200CanvaTool`:\n  - Background: `#0b0f19` (Slate 950)\n  - Surface: `#1e293b` (Slate 800)\n  - Primary accent: `#6366f1` (Indigo 500)\n  - Secondary accent: `#06b6d4` (Cyan 500)\n  - Success/Error/Warning colors\n  - Glassmorphism cards, smooth transitions\n  - Modern typography (Segoe UI / Inter)\n\n#### [NEW] [ui/main_window.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/ui/main_window.py)\n- **Main Hub** với sidebar navigation:\n  - 🤖 **AI Chat** — Trợ lý AI (hỏi → AI tự thực hiện)\n  - 🔄 **Workflows** — Visual workflow editor\n  - 🖱️ **Automation** — Desktop automation\n  - 📁 **File Processing** — Xử lý file hàng loạt\n  - ⚙️ **Settings** — Cài đặt & API keys\n- Status bar (AI status, running tasks, stats)\n- System tray icon\n\n#### [NEW] [ui/chat_panel.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/ui/chat_panel.py)\n- Chat UI hiện đại (bubble messages)\n- Người dùng mô tả bằng tiếng Việt → AI tạo workflow\n- AI có thể **thực thi trực tiếp** hành động (với xác nhận)\n- Hiển thị tool calls (AI đang làm gì)\n- Markdown rendering trong chat\n- Lưu/load lịch sử hội thoại\n\n#### [NEW] [ui/workflow_editor.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/ui/workflow_editor.py)\n- **Visual Canvas** kéo-thả nodes (QGraphicsView)\n- Node palette sidebar (drag để thêm node)\n- Kết nối nodes bằng đường nối (connection wires)\n- Node inspector panel (chỉnh thuộc tính node)\n- Zoom/Pan canvas\n- Save/Load workflow\n- AI suggestion — Gemini gợi ý cải thiện workflow\n- Run/Stop/Pause workflow trực tiếp\n\n#### [NEW] [ui/automation_panel.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/ui/automation_panel.py)\n- Quick macro recorder (record mouse/keyboard)\n- Step list editor (add/edit/delete steps)\n- Screen picker (chọn tọa độ trên màn hình)\n- AI-assisted: chụp screenshot → AI nhận diện element\n- Loop config (count/infinite/time-based)\n- Hotkey controls\n\n#### [NEW] [ui/file_panel.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/ui/file_panel.py)\n- Drag & drop file/folder\n- File list table (tên gốc, tên AI đề xuất, trạng thái)\n- AI operations: rename, classify, summarize\n- Preview kết quả trước khi apply\n- Progress bar\n\n#### [NEW] [ui/settings_dialog.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/ui/settings_dialog.py)\n- API Key management (multi-key, check quota, rotation)\n- Model selection (dropdown)\n- Theme selection\n- Hotkey configuration\n- General settings\n\n#### [NEW] [ui/log_viewer.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/ui/log_viewer.py)\n- Real-time execution log\n- Filter by level (INFO/WARNING/ERROR)\n- Searchable\n- Export log\n\n---\n\n### Component 5: Example Workflows & Presets\n\n#### [NEW] workflows/examples/\n- `web_scraping.json` — Mở Chrome → Navigate → Scrape data\n- `file_rename_batch.json` — Quét thư mục → AI đặt tên → Rename\n- `auto_form_fill.json` — Mở form → AI điền thông tin\n\n#### [NEW] presets/\n- `default_actions.json` — Preset mặc định cho action executor\n\n---\n\n## 🚀 Phân Phase Triển khai\n\n### **Phase 1 — Foundation + Core (Triển khai ngay)**\n1. Foundation files (main.py, config, requirements, GEMINI.md, README.md, bat files)\n2. Core AI Engine (ai_engine.py, key_manager.py, state_manager.py)\n3. Core Automation (action_executor.py, screen_analyzer.py, workflow_models.py)\n4. UI Foundation (theme.py, main_window.py)\n5. AI Chat Panel (chat_panel.py) — Module đầu tiên hoạt động\n6. Automation Panel (automation_panel.py) — Module desktop automation\n7. Settings Dialog (settings_dialog.py)\n\n### **Phase 2 — Workflow Engine (Sau Phase 1)**\n8. Workflow Runner (workflow_runner.py)\n9. Visual Workflow Editor (workflow_editor.py)\n10. File Processor (file_processor.py, file_panel.py)\n11. Example workflows\n\n### **Phase 3 — Advanced Features (Mở rộng)**\n12. Scheduler (scheduler.py)\n13. Log viewer (log_viewer.py)\n14. Build exe (build_exe.bat, .spec file)\n15. Advanced AI features (multi-agent, function calling chains)\n\n---\n\n## ✅ Verification Plan\n\n### Automated Tests\n```powershell\n# Chạy ứng dụng\npython main.py\n\n# Test AI engine\npython -c \"from core.ai_engine import GeminiAIEngine; e = GeminiAIEngine(); print(e.chat('Xin chào'))\"\n```\n\n### Manual Verification\n- Mở app → kiểm tra giao diện hiển thị đúng theme\n- Chat với AI → kiểm tra nhận/gửi tin nhắn\n- Tạo macro → record → play back\n- Chụp screenshot → AI phân tích\n- Save/Load workflow JSON\n\n---\n\n## Open Questions\n\n> [!IMPORTANT]\n> 1. **Persona AI**: AI Claw nên có persona gì? (Trợ lý chuyên nghiệp / Bạn bè thân thiện / Kỹ thuật viên)\n> 2. **Ngôn ngữ giao diện**: Toàn bộ tiếng Việt hay song ngữ Việt-Anh?\n> 3. **System tray**: Có cần chạy nền (minimize to tray) để chờ hotkey không?\n", "plans/account_auth_theme_widget_toast_plan.md": "# Kế Hoạch Triển Khai: Xác Thực Tài Khoản, Theme Sáng/Tối Chuẩn Tương Phản, Floating Widget & Tuỳ Chỉnh Vị Trí Toast\n\nTài liệu này mô tả chi tiết phương án kỹ thuật nâng cấp toàn diện các tính năng theo yêu cầu người dùng:\n1. **Hệ thống Xác thực Đăng nhập & Quản lý Tài khoản (Authentication & User Management)**\n2. **Chuẩn hoá Giao diện Sáng & Tối (Light/Dark Theme High Contrast & Polish)**\n3. **Widget Nút Nổi Truy Cập Nhanh (Floating Quick Access Widget)**\n4. **Tuỳ chỉnh Vị trí Thông Báo Toast (Customizable Toast Notification Position)**\n\n---\n\n## 1. Yêu Cầu & Phương Án Kỹ Thuật Chi Tiết\n\n### 1.1. Xác thực Đăng nhập & Quản lý Tài khoản\n- **Mặc định**: TẮT xác thực (`require_login = 0`), mở app vào thẳng màn hình chính.\n- **Bật/Tắt trong Cài đặt**: Thêm tab **\"👤 Quản Lý Tài Khoản & Bảo Mật\"** (hoặc tích hợp trong Cài đặt) với nút bật/tắt xác thực khi khởi động.\n- **Tài khoản mặc định**: Khi hệ thống chưa có user, tự động khởi tạo `admin` / `admin` (được băm mật khẩu bảo mật PBKDF2/SHA-256).\n- **Bảo mật giao diện đăng nhập ([login_dialog.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/ui/login_dialog.py))**:\n  - **TUYỆT ĐỐI KHÔNG** điền sẵn (autofill) `admin` hay gợi ý mật khẩu trên UI login. Các ô nhập username/password luôn để trống.\n  - Phím Enter tự động đăng nhập.\n  - Hiển thị lỗi rõ ràng nếu sai tài khoản/mật khẩu, đồng thời ghi log đăng nhập thất bại.\n- **Cơ sở dữ liệu người dùng & Lịch sử đăng nhập**:\n  - Bảng `users`: `id`, `username`, `password_hash`, `salt`, `display_name`, `role`, `is_active`, `login_count`, `last_login_at`, `created_at`, `updated_at`.\n  - Bảng `login_logs`: `id`, `username`, `status` (SUCCESS/FAILED), `ip_or_device`, `login_time`, `message`.\n  - Quản lý trên UI:\n    - Danh sách tài khoản với số lần đăng nhập, lần đăng nhập cuối.\n    - ➕ Thêm tài khoản mới, ✏️ Sửa thông tin / Đổi mật khẩu, 🗑️ Xoá tài khoản (có kiểm tra an toàn, không cho xoá tài khoản admin đang dùng nếu chỉ còn 1 tài khoản).\n    - Bảng lịch sử đăng nhập (Login Logs) kèm nút xoá logs.\n\n---\n\n### 1.2. Chuẩn hoá Giao diện Sáng & Tối (Contrast & Theme Polish)\n- **Giao diện sáng (Light Mode)**:\n  - Nền chính sạch sẽ, sáng nhẹ (`#f8fafc`), bề mặt thẻ `#ffffff`, viền `#cbd5e1` rõ ràng.\n  - Chữ chính: `#0f172a` (Slate 900 đậm, cực kỳ sắc nét), chữ phụ: `#334155` (Slate 700), mô tả: `#475569` (Slate 600).\n  - Không có tình trạng chữ trắng trên nền sáng hay chữ xám mờ khó đọc.\n- **Giao diện tối (Dark Mode)**:\n  - Nền tối sâu dịu mắt (`#0b0f19`), thẻ `#1e293b`, viền `#334155`.\n  - Chữ chính: `#f8fafc` (Slate 50 sáng rõ), chữ phụ: `#cbd5e1`, mô tả: `#94a3b8`.\n  - Đảm bảo tương phản hoàn hảo cho tất cả widget (Tables, GroupBoxes, Inputs, ComboBoxes, Radios, Menus, Dialogs).\n\n---\n\n### 1.3. Floating Quick Access Widget (Nút nổi truy cập nhanh)\n- Tạo module mới: [ui/floating_widget.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/ui/floating_widget.py).\n- **Tính năng nổi**:\n  - Cửa sổ Tool nổi luôn trên cùng (`WindowStaysOnTopHint | FramelessWindowHint | Tool`).\n  - Cho phép kéo thả (draggable) tự do trên toàn bộ màn hình desktop, tự nhớ vị trí (`float_widget_x`, `float_widget_y`).\n  - **Cơ chế làm mờ (Fade / Opacity)**:\n    - Khi không hover (idle): Độ mờ giảm xuống ~0.35 - 0.45 để không che khuất công việc trên màn hình.\n    - Khi rê chuột vào (hover): Tự động tăng độ mờ lên 1.0 mượt mà với hiệu ứng động (`QPropertyAnimation`).\n  - **Các nút thao tác nhanh**:\n    - 🪟 **Mở rộng cửa sổ**: Click để kích hoạt, đưa cửa sổ chính `MainWindow` lên trên cùng và focus làm việc.\n    - 📸 **Chụp màn hình nhanh**: Chụp màn hình và gửi ngay vào khung AI Chat.\n    - 💬 **Mở AI Chat**: Chuyển ngay đến trang Chat trong app.\n    - ⚙️ **Cài đặt**: Mở hộp thoại cài đặt.\n    - ❌ **Ẩn**: Thu nhỏ/ẩn thanh nổi.\n  - Tích hợp bật/tắt trong Menu `View`, Top bar, System Tray và Cài đặt.\n\n---\n\n### 1.4. Tuỳ chỉnh Vị trí Thông Báo Toast ([toast.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/ui/toast.py))\n- **Mặc định**: ↘️ Góc phải dưới cùng (`bottom-right`).\n- **Tuỳ chọn 6 vị trí trong Cài đặt**:\n  1. ↘️ Góc phải dưới cùng (Bottom-Right — Mặc định)\n  2. ↙️ Góc trái dưới cùng (Bottom-Left)\n  3. ↗️ Góc phải trên cùng (Top-Right)\n  4. ↖️ Góc trái trên cùng (Top-Left)\n  5. ⬆️ Giữa trên cùng (Top-Center)\n  6. ⬇️ Giữa dưới cùng (Bottom-Center)\n- Hỗ trợ hiển thị xếp chồng nhiều thông báo (stacking) thông minh theo hướng từ trên xuống hoặc từ dưới lên tương ứng với vị trí.\n\n---\n\n## 2. Danh Sách Files Thay Đổi\n\n### Core Layer\n- [MODIFY] [core/state_manager.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/core/state_manager.py): Thêm bảng `users` và `login_logs`, các phương thức hash mật khẩu, xác thực, CRUD user, thống kê lần đăng nhập/lần cuối đăng nhập, ghi/đọc logs đăng nhập.\n\n### UI Layer\n- [MODIFY] [ui/login_dialog.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/ui/login_dialog.py): Xoá bỏ điền sẵn tài khoản admin, kết nối xác thực SQLite an toàn, ghi nhận log và cập nhật thống kê, tương thích theme sáng/tối.\n- [NEW] [ui/floating_widget.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/ui/floating_widget.py): Widget nút nổi truy cập nhanh, làm mờ khi không kích hoạt, nút mở rộng cửa sổ chính, chụp màn hình, chat, cài đặt.\n- [MODIFY] [ui/toast.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/ui/toast.py): Hỗ trợ đọc cấu hình vị trí toast từ StateManager và tính toán toạ độ chuẩn cho 6 góc/vị trí.\n- [MODIFY] [ui/theme.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/ui/theme.py): Tối ưu bảng màu `COLORS_DARK` và `COLORS_LIGHT`, độ tương phản cao cho chữ và nền, styling đồng bộ cho tất cả control.\n- [MODIFY] [ui/settings_dialog.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/ui/settings_dialog.py): Thêm tab quản lý Tài khoản & Bảo mật (Bật/tắt login, CRUD User, đổi mật khẩu, xem logs), thêm tuỳ chọn vị trí Toast và bật/tắt Floating Widget.\n- [MODIFY] [ui/main_window.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/ui/main_window.py): Quản lý vòng đời `FloatingQuickAccessWidget`, menu hành động, hỗ trợ mở rộng cửa sổ khi bấm nút float.\n- [MODIFY] [main.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/main.py): Kiểm tra `require_login` (mặc định tắt), khởi chạy login dialog khi bật.\n\n---\n\n## 3. Kế Hoạch Kiểm Thử (Verification Plan)\n\n### Automated Syntax & Import Checks\n- Kiểm tra toàn bộ mã nguồn không có lỗi cú pháp:\n  `python -c \"import ast; [ast.parse(open(f, encoding='utf-8').read()) for f in ['core/state_manager.py', 'ui/login_dialog.py', 'ui/floating_widget.py', 'ui/toast.py', 'ui/theme.py', 'ui/settings_dialog.py', 'ui/main_window.py', 'main.py']]\"`\n- Kiểm tra import modules thành công:\n  `python -c \"from ui.floating_widget import FloatingQuickAccessWidget; from ui.login_dialog import AIClawLoginDialog; from core.state_manager import StateManager; print('Imports OK')\"`\n\n### Manual Verification Flows\n1. **Flow Đăng nhập & Quản lý User**:\n   - Chạy app với setting mặc định (`require_login = 0`) -> App vào thẳng màn hình chính.\n   - Mở Cài đặt -> Tab Tài khoản & Bảo mật -> Bật xác thực đăng nhập.\n   - Thêm tài khoản mới (ví dụ: `testuser` / `123456`), đổi mật khẩu `admin`, xem bảng người dùng (số lần đăng nhập, lần đăng nhập cuối).\n   - Đóng app, mở lại -> Xuất hiện màn hình Login với ô trống (không lộ admin) -> Đăng nhập bằng tài khoản -> Vào app và kiểm tra logs được ghi nhận chính xác.\n2. **Flow Giao diện Sáng/Tối**:\n   - Chuyển sang Light Mode: Nền sáng nhẹ, chữ đen/slate đậm nét, các thẻ nổi bật rõ ràng, không bị chìm chữ.\n   - Chuyển sang Dark Mode: Nền tối sâu dịu mắt, chữ trắng/xám sáng tương phản cao.\n3. **Flow Floating Quick Access Widget**:\n   - Bật Floating Widget -> Widget xuất hiện trên màn hình desktop.\n   - Rê chuột ra xa -> Widget mờ dần (~0.4 opacity). Rê chuột vào -> Widget sáng rõ (1.0 opacity).\n   - Thu nhỏ hoặc ẩn MainWindow -> Click nút 🪟 (Mở rộng) trên Float Widget -> MainWindow ngay lập tức hiện lên và focus.\n   - Kéo thả vị trí -> Tắt mở lại widget -> Vị trí được giữ nguyên.\n4. **Flow Vị trí Toast**:\n   - Đổi vị trí Toast sang Top-Right, Bottom-Left, Top-Center... trong Cài đặt -> Test bắn toast -> Toast xuất hiện đúng vị trí và xếp chồng mượt mà.\n", "plans/account_auth_theme_widget_toast_v2_plan.md": "# Kế Hoạch Triển Khai: Xác Thực Tài Khoản, Theme Sáng/Tối Chuẩn Tương Phản, Floating Widget & Tuỳ Chỉnh Vị Trí Toast\n\nTài liệu này mô tả chi tiết phương án kỹ thuật nâng cấp toàn diện các tính năng theo yêu cầu người dùng:\n1. **Hệ thống Xác thực Đăng nhập & Quản lý Tài khoản (Authentication & User Management)**\n2. **Chuẩn hoá Giao diện Sáng & Tối (Light/Dark Theme High Contrast & Polish)**\n3. **Widget Nút Nổi Truy Cập Nhanh (Floating Quick Access Widget)**\n4. **Tuỳ chỉnh Vị trí Thông Báo Toast (Customizable Toast Notification Position)**\n\n---\n\n## 1. Yêu Cầu & Phương Án Kỹ Thuật Chi Tiết\n\n### 1.1. Xác thực Đăng nhập & Quản lý Tài khoản\n- **Mặc định**: TẮT xác thực (`require_login = 0`), mở app vào thẳng màn hình chính.\n- **Bật/Tắt trong Cài đặt**: Thêm tab **\"👤 Quản Lý Tài Khoản & Bảo Mật\"** (hoặc tích hợp trong Cài đặt) với nút bật/tắt xác thực khi khởi động.\n- **Tài khoản mặc định**: Khi hệ thống chưa có user, tự động khởi tạo `admin` / `admin` (được băm mật khẩu bảo mật PBKDF2/SHA-256).\n- **Bảo mật giao diện đăng nhập ([login_dialog.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/ui/login_dialog.py))**:\n  - **TUYỆT ĐỐI KHÔNG** điền sẵn (autofill) `admin` hay gợi ý mật khẩu trên UI login. Các ô nhập username/password luôn để trống.\n  - Phím Enter tự động đăng nhập.\n  - Hiển thị lỗi rõ ràng nếu sai tài khoản/mật khẩu, đồng thời ghi log đăng nhập thất bại.\n- **Cơ sở dữ liệu người dùng & Lịch sử đăng nhập**:\n  - Bảng `users`: `id`, `username`, `password_hash`, `salt`, `display_name`, `role`, `is_active`, `login_count`, `last_login_at`, `created_at`, `updated_at`.\n  - Bảng `login_logs`: `id`, `username`, `status` (SUCCESS/FAILED), `ip_or_device`, `login_time`, `message`.\n  - Quản lý trên UI:\n    - Danh sách tài khoản với số lần đăng nhập, lần đăng nhập cuối.\n    - ➕ Thêm tài khoản mới, ✏️ Sửa thông tin / Đổi mật khẩu, 🗑️ Xoá tài khoản (có kiểm tra an toàn, không cho xoá tài khoản admin đang dùng nếu chỉ còn 1 tài khoản).\n    - Bảng lịch sử đăng nhập (Login Logs) kèm nút xoá logs.\n\n---\n\n### 1.2. Chuẩn hoá Giao diện Sáng & Tối (Contrast & Theme Polish)\n- **Giao diện sáng (Light Mode)**:\n  - Nền chính sạch sẽ, sáng nhẹ (`#f8fafc`), bề mặt thẻ `#ffffff`, viền `#cbd5e1` rõ ràng.\n  - Chữ chính: `#0f172a` (Slate 900 đậm, cực kỳ sắc nét), chữ phụ: `#334155` (Slate 700), mô tả: `#475569` (Slate 600).\n  - Không có tình trạng chữ trắng trên nền sáng hay chữ xám mờ khó đọc.\n- **Giao diện tối (Dark Mode)**:\n  - Nền tối sâu dịu mắt (`#0b0f19`), thẻ `#1e293b`, viền `#334155`.\n  - Chữ chính: `#f8fafc` (Slate 50 sáng rõ), chữ phụ: `#cbd5e1`, mô tả: `#94a3b8`.\n  - Đảm bảo tương phản hoàn hảo cho tất cả widget (Tables, GroupBoxes, Inputs, ComboBoxes, Radios, Menus, Dialogs).\n\n---\n\n### 1.3. Floating Quick Access Widget (Nút nổi truy cập nhanh)\n- Tạo module mới: [ui/floating_widget.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/ui/floating_widget.py).\n- **Tính năng nổi**:\n  - Cửa sổ Tool nổi luôn trên cùng (`WindowStaysOnTopHint | FramelessWindowHint | Tool`).\n  - Cho phép kéo thả (draggable) tự do trên toàn bộ màn hình desktop, tự nhớ vị trí (`float_widget_x`, `float_widget_y`).\n  - **Cơ chế làm mờ (Fade / Opacity)**:\n    - Khi không hover (idle): Độ mờ giảm xuống ~0.35 - 0.45 để không che khuất công việc trên màn hình.\n    - Khi rê chuột vào (hover): Tự động tăng độ mờ lên 1.0 mượt mà với hiệu ứng động (`QPropertyAnimation`).\n  - **Các nút thao tác nhanh**:\n    - 🪟 **Mở rộng cửa sổ**: Click để kích hoạt, đưa cửa sổ chính `MainWindow` lên trên cùng và focus làm việc.\n    - 📸 **Chụp màn hình nhanh**: Chụp màn hình và gửi ngay vào khung AI Chat.\n    - 💬 **Mở AI Chat**: Chuyển ngay đến trang Chat trong app.\n    - ⚙️ **Cài đặt**: Mở hộp thoại cài đặt.\n    - ❌ **Ẩn**: Thu nhỏ/ẩn thanh nổi.\n  - Tích hợp bật/tắt trong Menu `View`, Top bar, System Tray và Cài đặt.\n\n---\n\n### 1.4. Tuỳ chỉnh Vị trí Thông Báo Toast ([toast.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/ui/toast.py))\n- **Mặc định**: ↘️ Góc phải dưới cùng (`bottom-right`).\n- **Tuỳ chọn 6 vị trí trong Cài đặt**:\n  1. ↘️ Góc phải dưới cùng (Bottom-Right — Mặc định)\n  2. ↙️ Góc trái dưới cùng (Bottom-Left)\n  3. ↗️ Góc phải trên cùng (Top-Right)\n  4. ↖️ Góc trái trên cùng (Top-Left)\n  5. ⬆️ Giữa trên cùng (Top-Center)\n  6. ⬇️ Giữa dưới cùng (Bottom-Center)\n- Hỗ trợ hiển thị xếp chồng nhiều thông báo (stacking) thông minh theo hướng từ trên xuống hoặc từ dưới lên tương ứng với vị trí.\n\n---\n\n\n\n---\n\n## 3. Kế Hoạch Kiểm Thử (Verification Plan)\n\n### Automated Syntax & Import Checks\n- Kiểm tra toàn bộ mã nguồn không có lỗi cú pháp:\n  `python -c \"import ast; [ast.parse(open(f, encoding='utf-8').read()) for f in ['core/state_manager.py', 'ui/login_dialog.py', 'ui/floating_widget.py', 'ui/toast.py', 'ui/theme.py', 'ui/settings_dialog.py', 'ui/main_window.py', 'main.py']]\"`\n- Kiểm tra import modules thành công:\n  `python -c \"from ui.floating_widget import FloatingQuickAccessWidget; from ui.login_dialog import AIClawLoginDialog; from core.state_manager import StateManager; print('Imports OK')\"`\n\n### Manual Verification Flows\n1. **Flow Đăng nhập & Quản lý User**:\n   - Chạy app với setting mặc định (`require_login = 0`) -> App vào thẳng màn hình chính.\n   - Mở Cài đặt -> Tab Tài khoản & Bảo mật -> Bật xác thực đăng nhập.\n   - Thêm tài khoản mới (ví dụ: `testuser` / `123456`), đổi mật khẩu `admin`, xem bảng người dùng (số lần đăng nhập, lần đăng nhập cuối).\n   - Đóng app, mở lại -> Xuất hiện màn hình Login với ô trống (không lộ admin) -> Đăng nhập bằng tài khoản -> Vào app và kiểm tra logs được ghi nhận chính xác.\n2. **Flow Giao diện Sáng/Tối**:\n   - Chuyển sang Light Mode: Nền sáng nhẹ, chữ đen/slate đậm nét, các thẻ nổi bật rõ ràng, không bị chìm chữ.\n   - Chuyển sang Dark Mode: Nền tối sâu dịu mắt, chữ trắng/xám sáng tương phản cao.\n3. **Flow Floating Quick Access Widget**:\n   - Bật Floating Widget -> Widget xuất hiện trên màn hình desktop.\n   - Rê chuột ra xa -> Widget mờ dần (~0.4 opacity). Rê chuột vào -> Widget sáng rõ (1.0 opacity).\n   - Thu nhỏ hoặc ẩn MainWindow -> Click nút 🪟 (Mở rộng) trên Float Widget -> MainWindow ngay lập tức hiện lên và focus.\n   - Kéo thả vị trí -> Tắt mở lại widget -> Vị trí được giữ nguyên.\n4. **Flow Vị trí Toast**:\n   - Đổi vị trí Toast sang Top-Right, Bottom-Left, Top-Center... trong Cài đặt -> Test bắn toast -> Toast xuất hiện đúng vị trí và xếp chồng mượt mà.\n\n   \n   \n   Kế Hoạch Triển Khai: Xác Thực Tài Khoản, Theme Sáng/Tối Chuẩn Tương Phản, Floating Widget & Tuỳ Chỉnh Vị Trí Toast\n\n   \n   ", "plans/canva_tool_studio_plan.md": "# Kế Hoạch Nâng Cấp & Hoàn Thiện Canva Tool Studio\n\n## Tổng Quan Mục Tiêu\nBản nâng cấp toàn diện giải quyết triệt để các yêu cầu:\n1. **Backup Code**: Tạo bản sao lưu an toàn toàn bộ mã nguồn hiện tại.\n2. **Khắc phục triệt để lag/đơ/Not Responding**: Tối ưu hóa đa luồng nền (QThread, throttling tín hiệu progress, giải phóng main GUI thread).\n3. **Mặc định chuyển đổi Video giữ 94% độ nét**: Cấu hình mặc định độ nét 94% (CRF 19 - Sắc nét chuẩn studio) cho video và hiển thị trực quan.\n4. **Nén PPTX & Video an toàn 100% cho Microsoft Office & WPS Office**:\n   - Đóng gói chuẩn OpenXML Zip (bảo toàn cấu trúc `[Content_Types].xml`, `_rels`, timestamp chuẩn, đường dẫn forward-slash).\n   - Nén video nhúng: Ép chuẩn H.264 High/Main Profile Level 4.1, `pix_fmt=yuv420p`, kích thước chẵn (even dimensions), AAC stereo audio, `+faststart` moov atom, bảo toàn định dạng tệp và mối quan hệ slide XML.\n   - Nén ảnh nhúng: Baseline JPEG & chuẩn PNG (RGB/RGBA), không làm sai lệch cấu trúc slide.\n5. **Hệ thống Quản lý Tài khoản & Xác thực Đăng nhập**:\n   - Mặc định: **TẮT** (không bắt buộc đăng nhập khi vào app).\n   - Khi BẬT: Đăng nhập tài khoản mặc định `admin`/`admin` (không hiển thị lộ thông tin ở gợi ý/placeholder).\n   - Bảng quản trị tài khoản trong Cài đặt: Thêm, sửa, xoá tài khoản, đổi mật khẩu, theo dõi số lần đăng nhập, lần đăng nhập cuối cùng, nhật ký đăng nhập chi tiết.\n6. **Giao diện Sáng / Tối tối ưu độ tương phản**:\n   - Giao diện Sáng (Light): Nền sáng nhẹ/trắng thanh thoát, màu chữ đậm tương phản cao, tuyệt đối không bị chìm màu.\n   - Giao diện Tối (Dark): Nền tối sang trọng, màu chữ sáng rõ, sắc nét.\n7. **Nút cuộn (Scrollbar) tự động trong Cài đặt**:\n   - Thiết lập `QScrollArea` với cơ chế cuộn thông minh (chỉ hiển thị thanh cuộn khi nội dung vượt quá chiều cao màn hình, ẩn khi đủ không gian).\n8. **Tiện ích Floating Mini Bar**:\n   - Thanh công cụ nổi tiện lợi trên màn hình, kéo thả tự do, tự động mờ khi không chạm (Auto-Dimming), nút mở rộng bung to lại cửa sổ chính. Nút bật/tắt Float Bar trực tiếp trên HeaderBar.\n9. **Cấu hình Vị trí Toast Notification**:\n   - Mặc định: **Góc phải dưới cùng (Bottom-Right)**.\n   - Hỗ trợ tuỳ chỉnh trong Cài đặt: Góc phải trên/dưới, Góc trái trên/dưới, Chính giữa trên/dưới.\n10. **Tài liệu & Quy tắc**:\n    - Tạo/cập nhật `Update1.md` liệt kê chi tiết toàn bộ tính năng.\n    - Cập nhật quy tắc chống lỗi tương tự vào `GEMINI.md`.\n\n---\n\n## Các Thay Đổi Cụ Thể\n\n### 1. Sao Lưu Toàn Bộ Mã Nguồn\n- Tạo thư mục `backup/canva_tool_backup_latest/` hoặc gói nén sao lưu đầy đủ hiện trạng.\n\n### 2. Tối Ưu Hiệu Năng & Chống Đơ Lag (Anti-Freeze Architecture)\n- Throttling tín hiệu tiến độ trong `VideoBatchWorker` và `PPTXBatchWorker` (tối đa 15-20 updates/giây thay vì phát tín hiệu liên tục theo từng dòng ffmpeg stderr làm nghẽn Qt Event Loop).\n- Đảm bảo toàn bộ tác vụ đĩa nặng, tính toán kích thước, dò bitrate, trích xuất zip đều chạy 100% trong Background Thread `QThread`.\n\n### 3. Video Engine & Mặc Định 94% Độ Nét\n- Cập nhật `canva_tool/config.py` và `canva_tool/core/settings_manager.py`:\n  - `video_crf`: Đặt mặc định 19 (tương đương 94% độ nét mắt thường không phân biệt được so với gốc).\n  - Cập nhật UI Slider trong `MediaStudioView` hiển thị mức `94% (CRF 19 - Sắc nét tối ưu)`.\n\n### 4. PPTX Engine An Toàn Tuyệt Đối Cho Microsoft Office & WPS\n- Cập nhật `canva_tool/core/pptx_engine.py`:\n  - Đảm bảo video nén trong PPTX luôn có kích thước chẵn (`-vf \"scale=trunc(iw/2)*2:trunc(ih/2)*2\"`), pixel format `yuv420p`, profile `high`, level `4.1`, audio `aac` 44.1k/48k stereo, container flag `+faststart`.\n  - Tối ưu ảnh với chế độ Baseline JPEG và RGB/RGBA PNG, tránh làm hỏng slide XML parser của WPS/PowerPoint.\n  - Viết lại zip đóng gói PPTX đảm bảo thứ tự `[Content_Types].xml` chuẩn, kiểm tra `testzip()` tự động.\n\n### 5. Quản Lý Tài Khoản & Cài Đặt Hệ Thống\n- Tạo mô-đun quản lý xác thực `canva_tool/core/auth_manager.py`:\n  - Quản lý tài khoản (admin, user), mã hóa hash mật khẩu, lưu trữ `auth_data.json`.\n  - Lưu trữ lịch sử đăng nhập (thời gian, tài khoản, trạng thái), đếm số lần đăng nhập, lần đăng nhập cuối.\n- Cập nhật `canva_tool/ui/login_dialog.py`:\n  - Xóa bỏ text gợi ý `admin`/`admin` mặc định khỏi ô nhập.\n  - Tích hợp xác thực với `AuthManager`.\n- Tạo Dialog / Giao diện Cài Đặt Toàn Diện `canva_tool/ui/settings_dialog.py` (hoặc Tab Cài Đặt) bao gồm:\n  - Bật / Tắt yêu cầu đăng nhập (Mặc định: TẮT).\n  - Bảng quản trị tài khoản: Thêm, Sửa thông tin & Mật khẩu, Xoá tài khoản, Xem lịch sử và số lần đăng nhập.\n  - Cấu hình vị trí Toast Notification (Mặc định: Góc phải dưới cùng).\n  - Cài đặt giao diện & Chế độ Float Mini Bar.\n  - Sử dụng `QScrollArea` cuộn mượt mà chỉ khi nội dung vượt quá kích thước màn hình.\n\n### 6. Giao Diện & Tiện Ích Floating Mini Bar\n- Cập nhật `canva_tool/ui/theme_engine.py`: Rà soát và tinh chỉnh độ tương phản màu sắc cho Light Mode & Dark Mode.\n- Nâng cấp `canva_tool/ui/widgets/floating_mini_bar.py` và kết nối với HeaderBar / MainWindow.\n- Nâng cấp `canva_tool/ui/widgets/toast_notification.py` hỗ trợ vị trí linh hoạt theo cài đặt.\n\n### 7. Cập Nhật Tài Liệu & Note GEMINI.md\n- Tạo `Update1.md` tổng hợp toàn diện chức năng.\n- Bổ sung kinh nghiệm xử lý lỗi & quy chuẩn kỹ thuật vào `GEMINI.md`.\n\n---\n\n## Kế Hoạch Kiểm Thử (Verification Plan)\n1. **Kiểm tra Unit Tests**: Chạy `python -m unittest discover tests` đảm bảo 100% tests vượt qua.\n2. **Kiểm tra Xác thực & Cài đặt**:\n   - Kiểm tra khi `require_login = False` (mặc định): App vào thẳng không cần login.\n   - Khi `require_login = True`: Hiện login dialog không có thông tin gợi ý, đăng nhập đúng vào được, ghi nhận số lần và thời gian đăng nhập.\n   - Thêm/sửa/xóa tài khoản thành công trong Cài đặt.\n3. **Kiểm tra Chuyển đổi Video**:\n   - Mặc định 94% độ nét (CRF 19).\n   - Kiểm tra lệnh FFmpeg xuất ra chuẩn H.264 / `yuv420p` / `+faststart`.\n4. **Kiểm tra PPTX Optimizer**:\n   - Kiểm tra giải nén, tối ưu media và đóng gói PPTX.\n   - Đảm bảo tệp PPTX sau khi nén có thể mở mượt mà trên Microsoft PowerPoint & WPS Office không báo lỗi định dạng hay media error.\n5. **Kiểm tra Giao diện Sáng/Tối & Scrollbar**:\n   - Chuyển đổi theme Light / Dark mượt mà, văn bản rõ nét tương phản chuẩn.\n   - Thu nhỏ cửa sổ Settings kiểm tra thanh cuộn chỉ xuất hiện khi cần thiết.\n", "walkthroughs/ai_claw_upgrade_walkthrough.md": "# Tổng Kết Nâng Cấp Ứng Dụng AI Claw\n\nChúng tôi đã hoàn thành toàn bộ 4 nhóm tính năng theo đúng yêu cầu:\n\n---\n\n## 1. Hệ Thống Xác Thực Đăng Nhập & Quản Lý Tài Khoản\n- **Mặc định**: TẮT (`require_login = 0`), khi mở app sẽ vào thẳng giao diện chính mà không đòi hỏi đăng nhập.\n- **Bật/Tắt trong Cài đặt**: Trong tab **\"👤 Tài Khoản & Bảo Mật\"**, người dùng có thể bật/tắt chính sách xác thực chỉ bằng 1 thao tác.\n- **Màn hình Đăng Nhập ([ui/login_dialog.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/ui/login_dialog.py))**:\n  - Khi bật tính năng đăng nhập, hộp thoại xuất hiện khi mở ứng dụng.\n  - Các ô tài khoản và mật khẩu **hoàn toàn để trống** (không điền sẵn `admin`, không gợi ý tài khoản để tránh lộ thông tin).\n  - Tài khoản mặc định: `admin` / `admin` (mật khẩu được băm an toàn với salt ngẫu nhiên).\n- **Quản lý Tài khoản & Nhật ký**:\n  - Bảng danh sách tài khoản: Hiển thị ID, Tên đăng nhập, Tên hiển thị, Vai trò, Lần đăng nhập cuối, Số lần đăng nhập, Trạng thái.\n  - Thao tác: ➕ Thêm tài khoản mới, ✏️ Sửa thông tin, 🔑 Đổi mật khẩu, 🗑️ Xoá tài khoản.\n  - Bảng nhật ký đăng nhập: Lưu lại toàn bộ lịch sử đăng nhập (thành công/thất bại), thiết bị, thời gian kèm nút xoá logs.\n\n---\n\n## 2. Chuẩn Hoá Giao Diện Sáng / Tối (High Contrast & Polish)\n- **Giao diện sáng (Light Mode)**: Nền sáng nhẹ (`#f8fafc`), bề mặt cards & dialogs `#ffffff`, chữ chính `#0f172a` (Slate 900 đậm nét), chữ phụ `#334155`, viền `#cbd5e1` rõ ràng, không bị mờ hay chìm chữ.\n- **Giao diện tối (Dark Mode)**: Nền tối sâu (`#0b0f19`), thẻ `#1e293b`, chữ chính `#f8fafc`, chữ phụ `#cbd5e1`, mô tả `#94a3b8` tương phản cao, dịu mắt.\n- Toàn bộ các widget (Bảng tables, inputs, dialogs, buttons, groupboxes, radios, preview) đều tương thích và đồng bộ màu sắc.\n\n---\n\n## 3. Widget Nút Nổi Desktop (Floating Quick Access Widget)\n- Tạo module mới [ui/floating_widget.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/ui/floating_widget.py).\n- **Đặc điểm**:\n  - Thanh nổi bo góc hiện đại, luôn ở trên cùng màn hình (`WindowStaysOnTopHint | FramelessWindowHint | Tool`).\n  - Có thể kéo thả tự do trên toàn bộ màn hình desktop, tự động nhớ vị trí khi khởi động lại.\n  - **Tự động làm mờ**: Khi không thao tác (inactive), thanh mờ xuống ~38% độ sáng để không che khuất công việc. Khi rê chuột vào, thanh sáng rõ 100% với animation mượt mà.\n  - **Các nút truy cập nhanh**:\n    - 🪟 **Mở rộng**: Kích hoạt, đưa cửa sổ chính `MainWindow` lên trên cùng và focus làm việc.\n    - 📸 **Chụp màn hình nhanh**: Chụp ảnh màn hình và đưa ngay vào AI Chat.\n    - 💬 **Mở AI Chat**: Mở và focus vào ô nhập chat.\n    - ⚙️ **Cài đặt**: Mở hộp thoại cài đặt.\n    - ✕ **Ẩn**: Thu nhỏ/ẩn nút nổi.\n  - Hỗ trợ bật/tắt nhanh qua Menu `View`, nút `📌 Float` trên thanh topbar, hoặc trong Cài đặt.\n\n---\n\n## 4. Tuỳ Chỉnh Vị Trí Thông Báo Toast ([ui/toast.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/ui/toast.py))\n- **Mặc định**: ↘️ Góc phải dưới cùng (`bottom-right`).\n- **Tuỳ chọn 6 vị trí trong Cài đặt (Tab \"💬 Tuỳ chọn Hiển thị\")**:\n  1. ↘️ Góc phải dưới cùng (Bottom-Right — Mặc định)\n  2. ↙️ Góc trái dưới cùng (Bottom-Left)\n  3. ↗️ Góc phải trên cùng (Top-Right)\n  4. ↖️ Góc trái trên cùng (Top-Left)\n  5. ⬆️ Giữa trên cùng (Top-Center)\n  6. ⬇️ Giữa dưới cùng (Bottom-Center)\n- Nút **🧪 Thử nghiệm vị trí thông báo** cho phép bắn toast ngay lập tức để xem trước vị trí.\n- Xếp chồng nhiều thông báo (stacking) thông minh theo hướng từ dưới lên (cho góc dưới) hoặc từ trên xuống (cho góc trên).\n\n---\n\n## 5. Kết Quả Kiểm Thử (Verification Results)\n- Syntax AST check: **100% PASS** trên toàn bộ 8 file mã nguồn.\n- StateManager Database & Auth lifecycle (create, authenticate, update, change password, delete, login logs): **100% PASS**.\n- Mặc định khởi động: `require_login = 0` (Vào thẳng app không cần login).\n- Toast position dynamic load: **PASS** (`bottom-right` default).\n\n\n-------------------------\n\n### 1. 🔒 Xác Thực Đăng Nhập & Quản Lý Tài Khoản\n- **Mặc định**: TẮT (`require_login = 0`), khi mở app sẽ vào thẳng giao diện chính mà không đòi hỏi đăng nhập.\n- **Bật/Tắt trong Cài đặt**: Trong tab **\"👤 Tài Khoản & Bảo Mật\"** của [SettingsDialog](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/ui/settings_dialog.py), bạn có thể bật/tắt chính sách xác thực chỉ bằng 1 thao tác.\n- **Màn hình Đăng Nhập ([AIClawLoginDialog](file:///c:/Intel/Larag i/main_window.py) lên trên cùng.\n  - 📸 **Chụp màn hình nhanh**: Chụp ảnh màn hình và đưa ngay vào AI Chat.\n  - 💬 **Mở AI Chat**: Mở và focus vào ô nhập chat.\n  - ⚙️ **Cài đặt**: Mở hộp thoại cài đặt.\n  - ✕ **Ẩn**: Thu nhỏ/ẩn thanh nổi (có thể bật lại qua menu `View` hoặc nút `📌 Float` trên thanh topbar).\n\n---\n\n### 4. 🔔 Tuỳ Chỉnh Vị Trí Thông Báo Toast ([ToastNotification](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/ui/toast.py))\n- **Mặc định**: ↘️ Góc phải dưới cùng (`bottom-right`).\n- **Tuỳ chọn 6 vị trí trong Cài đặt (Tab \"💬 Tuỳ chọn Hiển thị\")**:\n  1. ↘️ Góc phải dưới cùng (Bottom-Right — Mặc định)\n  2. ↙️ Góc trái dưới cùng (Bottom-Left)\n  3. ↗️ Góc phải trên cùng (Top-Right)\n  4. ↖️ Góc trái trên cùng (Top-Left)\n  5. ⬆️ Giữa trên cùng (Top-Center)\n  6. ⬇️ Giữa dưới cùng (Bottom-Center)\n- Có sẵn nút **🧪 Thử nghiệm vị trí thông báo** để xem ngay kết quả trực tiếp và tự động xếp chồng (stacking) thông minh.\n\n", "walkthroughs/ai_claw_upgrade_v1_walkthrough.md": "# Tổng Kết Nâng Cấp Ứng Dụng AI Claw\n\nChúng tôi đã hoàn thành toàn bộ 4 nhóm tính năng theo đúng yêu cầu:\n\n---\n\n## 1. Hệ Thống Xác Thực Đăng Nhập & Quản Lý Tài Khoản\n- **Mặc định**: TẮT (`require_login = 0`), khi mở app sẽ vào thẳng giao diện chính mà không đòi hỏi đăng nhập.\n- **Bật/Tắt trong Cài đặt**: Trong tab **\"👤 Tài Khoản & Bảo Mật\"**, người dùng có thể bật/tắt chính sách xác thực chỉ bằng 1 thao tác.\n- **Màn hình Đăng Nhập ([ui/login_dialog.py](file:///c:/Intel/Laragon/www/PythonAll/300AIClaude/ui/login_dialog.py))**:\n  - Khi bật tính năng đăng nhập, hộp thoại xuất hiện khi mở ứng dụng.\n  - Các ô tài khoản và mật khẩu **hoàn toàn để trống** (không điền sẵn `admin`, không gợi ý tài khoản để tránh lộ thông tin).\n  - Tài khoản mặc định: `admin` / `admin` (mật khẩu được băm an toàn với salt ngẫu nhiên).\n- **Quản lý Tài khoản & Nhật ký**:\n  - Bảng danh sách tài khoản: Hiển thị ID, Tên đăng nhập, Tên hiển thị, Vai trò, Lần đăng nhập cuối, Số lần đăng nhập, Trạng
